function profileModal(id){const current=state.profiles.find(p=>p.id===id),p=current?clone(current):{id:uid(),name:'',fields:defaults(),enabled:['format','rake','stack','duration','finalTable','bubbleThreshold'],isDefault:false,preset:'standard'};let body='<p class="muted smalltext">勾选此模板应设置的字段。未勾选的字段由赛事内置默认值提供。带 ★ 的是常用字段。</p>'+field('模板名称','name',p.name,'text','','required maxlength="60"')+check('★ 设为默认模板','isDefault',p.isDefault,'创建新赛事时自动应用，替换原来的默认模板。');body+=FIELDS.map(f=>(f[0]?'<div class="sectionline">'+f[0]+'</div>':'')+'<div class="modal-fieldrow"><input type="checkbox" name="use_'+f[1]+'" data-profile-enable="'+f[1]+'" '+(p.enabled.includes(f[1])?'checked':'')+' aria-label="将'+f[2]+'纳入模板"><label>'+f[2]+'</label>'+(f[4]==='bool'?'<label class="checkline"><input type="checkbox" name="v_'+f[1]+'" '+(p.fields[f[1]]?'checked':'')+' '+(p.enabled.includes(f[1])?'':'disabled')+'>开启</label>':f[4]==='select'?'<select name="v_'+f[1]+'" '+(p.enabled.includes(f[1])?'':'disabled')+'>'+f[5].map(o=>'<option value="'+o[0]+'" '+(o[0]===p.fields[f[1]]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>':'<input name="v_'+f[1]+'" type="number" min="0" value="'+num(p.fields[f[1]])+'" '+(p.enabled.includes(f[1])?'':'disabled')+'>')+'</div>').join('');modal(current?'编辑模板：'+esc(p.name):'新建赛事模板',body,data=>{p.name=data.name.trim();if(!p.name)return toast('请输入模板名称',true);p.enabled=FIELDS.filter(f=>data['use_'+f[1]]).map(f=>f[1]);FIELDS.forEach(f=>{if(p.enabled.includes(f[1]))p.fields[f[1]]=f[4]==='number'?num(data['v_'+f[1]]):data['v_'+f[1]]});if(p.enabled.includes('duration')&&p.fields.duration<1)return toast('每级时长至少为 1 分钟',true);if(p.fields.rake>p.fields.buyin)return toast('服务费不能高于买入总额',true);p.isDefault=data.isDefault;mutate(current?'编辑赛事模板':'新建赛事模板',()=>{if(p.isDefault)state.profiles.forEach(x=>x.isDefault=false);const n=state.profiles.findIndex(x=>x.id===id);if(n<0)state.profiles.push(p);else state.profiles[n]=p});closeModal();render();toast('模板已保存')})}

d','标准','15 级，每级 20 分钟'],['turbo','快速','12 级，每级 10 分钟'],['deep','深筹码','18 级，每级 30 分钟'],['custom','自定义','自行编辑结构']])+'<div class="between" style="margin:18px 0">'+btn('✦ 为我推荐结构','suggest-structure')+btn('导出结构 CSV','export-levels','small')+'</div><div class="field-grid">'+field('默认每级时长（分钟）','duration',d.duration,'number','','min="1"')+field('级别数量','levelCount',d.levels.length,'number','','min="1" max="50"')+'</div>'+check('每一级结束时暂停计时','pauseEachLevel',d.pauseEachLevel)+'<div class="notice">预计总时长：<b>'+fmt(d.levels.reduce((s,l)=>s+l.minutes+(l.breakAfter||0),0))+' 分钟</b>（含休息）</div>'+levelsTable(d.levels,true)+'<div class="actions" style="margin-top:17px">'+btn('+ 添加级别','level-add')+btn('+ 添加休息','break-add')+'</div>')+configSection('cfg-payouts','奖金与奖品','按实际奖池计算名次奖金。百分比合计必须为 100%。',choices('payoutPreset',d.payoutPreset,[['custom','自定义','自行设置名次与比例'],['standard','标准','50% / 30% / 20%'],['top','头重','60% / 25% / 15%'],['flat','均衡','40% / 30% / 20% / 10%'],['winner','冠军全得','第一名 100%']])+field('预计参赛人次','estimated',d.estimated,'number','','min="1"')+'<p class="muted">预计奖池：<b id="estimated-pool">'+money(Math.max(d.guarantee,d.estimated*(d.buyin-d.rake-(d.bountyEnabled?d.bountyAmount:0))))+'</b></p>'+payoutEditor(d)+'<div class="actions" style="margin:16px 0">'+btn('+ 添加名次','payout-add')+'</div>'+check('在赛事电视上显示奖金分配','showPayout',d.showPayout)+'<h3>非现金奖品</h3><p class="muted smalltext">将奖品绑定到名次或名次范围，支持同一名次获得多项奖品。</p>'+prizeEditor(d)+btn('+ 添加非现金奖品','prize-add'))+configSection('cfg-connect','连接显示屏','为本场赛事选择已有的永久显示屏，或在创建后打开单场展示页。',state.displays.filter(x=>x.kind==='tournament').map(x=>check(esc(x.name),'screen_'+x.id,d.displayIds.includes(x.id))).join('')+btn('+ 添加显示屏','display-new','small')+'<div class="notice" style="margin-top:15px">单文件展示页可在当前浏览器的新标签页中打开并同步。本地文件不提供跨设备配对服务器。</div>'+(state.settings.voice?check('启用本场中文语音播报','voice',d.voice):'')+btn('+ 将当前配置保存为新模板','draft-profile'))+'<div class="sticky-actions">'+btn('取消','config-cancel')+'<button class="primary" type="submit">'+(d.id function counterEntryModal(id){const e=getEvent(id);modal('添加匿名参赛人数',field('新增人数','quantity',1,'number','','min="1" max="100" required')+field('每人发放筹码','chips',e.config.stack,'number','','min="1" required')+'<p class="muted smalltext">仅记录人数、筹码和奖金，不建立实名玩家档案。</p>',data=>{if(!entryOpen(e))return toast('报名已关闭',true);mutate('添加匿名参赛人数',()=>{for(let i=0;i<num(data.quantity);i++){const playerId='anon-'+uid(),x={id:uid(),playerId,displayName:'匿名玩家 '+(e.entries.length+1),stack:num(data.chips),issued:num(data.chips),status:'active',rank:null,table:0,seat:0,reentries:0,addons:0,knockouts:0,bounty:e.config.bountyEnabled?e.config.bountyAmount:0,wonBounties:0};e.entries.push(x);e.transactions.push({id:uid(),time:new Date().toISOString(),playerId,type:'买入',amount:e.config.buyin,rake:e.config.rake,pool:e.config.buyin-e.config.rake-(e.config.bountyEnabled?e.config.bountyAmount:0)})}},id);closeModal();render()},{submit:'确认增加人数'})}
function rebuyModal(id,entryId){const e=getEvent(id),x=e.entries.find(p=>p.id===entryId);if(e.finalized||e.config.format!=='rebuy'||!x||x.status!=='active')return toast('本场或玩家状态不允许重购',true);if(e.level+1>=e.config.reentryCutoff)return toast('已经达到重购截止级别',true);if(x.stack>e.config.stack)return toast('筹码高于起始筹码，不能重购',true);confirmLocal('确认重购','向 '+esc(playerName(x.playerId))+' 发放 '+fmt(e.config.stack)+' 筹码，费用 '+money(e.config.reentryPrice)+'。保留当前座位。',()=>mutate('玩家重购',()=>{x.stack+=e.config.stack;x.issued+=e.config.stack;x.rebuys=(x.rebuys||0)+1;e.transactions.push({id:uid(),time:new Date().toISOString(),playerId:x.playerId,type:'重购',amount:e.config.reentryPrice,rake:Math.min(e.config.rake,e.config.reentryPrice),pool:Math.max(0,e.config.reentryPrice-e.config.rake)})},id))}
function addonModal(id){const e=getEvent(id);if(!e.config.addonEnabled||e.finalized)return toast('本场未开放追加筹码',true);modal('追加筹码',select('玩家','entryId','',e.entries.filter(x=>x.status==='active').map(x=>[x.id,playerName(x.playerId)]))+'<p>追加 '+fmt(e.config.addonChips)+' 筹码，费用 '+money(e.config.addonPrice)+'。</p>',data=>{const x=e.entries.find(p=>p.id===data.entryId);if(!x)return toast('请选择在赛玩家',true);if(e.config.addonMax>0&&x.addons>=e.config.addonMax)return toast('该玩家已达到追加次数上限',true);mutate('追加筹码',()=>{x.stack+=e.config.addonChips;x.issued+=e.config.addonChips;x.addons++;e.transactions.push({id:uid(),time:new Date().toISOString(),playerId:x.playerId,type:'追加',amount:e.config.addonPrice,rake:0,pool:e.config.addonPrice})},id);closeModal();render()},{submit:'确认追加'})}
function tablesView(e){const tableNos=Array.from(new Set(e.entries.filter(x=>x.status==='active'&&x.table).map(x=>x.table))).sort((a,b)=>a-b);return card('桌台','<div class="actions">'+btn('随机分座','seat-draw','primary','data-id="'+e.id+'" '+(e.finalized?'disabled':''))+btn('平衡桌台','seat-balance','','data-id="'+e.id+'" '+(e.finalized?'disabled':''))+btn('手动移动座位','seat-move','','data-id="'+e.id+'" '+(e.finalized?'disabled':''))+'</div><p class="muted smalltext">每桌 '+(e.config.seatsPerTable||9)+' 席；只给在赛玩家分配座位。</p>'+(!tableNos.length?empty('尚未分座','先添加玩家，再使用随机分座。'):tableNos.map(t=>'<h3 style="margin-top:24px">第 '+t+' 桌</h3><div class="seat-layout">'+Array.from({length:e.config.seatsPerTable||9},(_,i)=>{const p=e.entries.find(x=>x.status==='active'&&x.table===t&&x.seat===i+1);return '<div class="seat '+(!p?'empty-seat':'')+'">'+(i+1)+' 号<br><strong>'+(p?esc(playerName(p.playerId)):'空位')+'</strong></div>'}).join('')+'</div>').join('')))}
function drawSeats(id,balance=false){const e=getEvent(id);if(e.finalized)return;const live=e.entries.filter(x=>x.status==='active');if(!live.length)return toast('请先添加玩家',true);const n=e.config.seatsPerTable||9,tableCount=Math.ceil(live.length/n);mutate(balance?'平衡桌台':'随机分座',()=>{const ordered=balance?live:live.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);ordered.forEach((x,i)=>{x.table=i%tableCount+1;x.seat=Math.floor(i/tableCount)+1})},id);render();toast('已分配唯一座位')}
function payoutAmounts(e){const poolCents=Math.round(stats(e).pool*100),shares=e.config.payouts.map(p=>Math.floor(poolCents*p.percent/100));let rest=poolCents-shares.reduce((a,b)=>a+b,0);for(let i=0;rest>0&&shares.length;i=(i+1)%shares.length,rest--)shares[i]++;return shares.map(x=>x/100)}

function finalize(id){const e=getEvent(id),live=e.entries.filter(x=>x.status==='active');if(!e.entries.length)return toast('没有参赛记录，无法确认赛果',true);if(live.length>1)return toast('尚有多名玩家在赛，请先处理淘汰或录入名次',true);confirmLocal('正式确认赛果','确认后本场停止入场与控赛，并计入累计报表和联赛。',()=>{mutate('正式确认赛果',()=>{if(live[0]){live[0].rank=1;live[0].status='winner'}e.remaining=remaining(e);e.running=false;e.finalized=true;e.status='finished';e.finishedAt=new Date().toISOString()},id);controlTab='payouts'})}

function formula(source,vars){if(source.length>300)throw Error('公式过长');const tokens=source.match(/\d+(?:\.\d+)?|[A-Za-z_][A-Za-z_0-9]*|>=|<=|==|!=|[+\-*/^(),?:<>]/g)||[];if(tokens.join('')!==source.replace(/\s/g,''))throw Error('包含不支持的字符');let at=0;const funcs={sqrt:Math.sqrt,log:Math.log,log10:Math.log10,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil,min:Math.min,max:Math.max,pow:Math.pow,exp:Math.exp};function primary(){const t=tokens[at++];if(t==='('){const v=expr(0);if(tokens[at++]!==')')throw Error('括号不匹配');return v}if(t==='-')return -primary();if(t==='+')return primary();if(/^\d/.test(t||''))return Number(t);if(t&&Object.hasOwn(funcs,t)){if(tokens[at++]!=='(')throw Error('函数缺少括号');const args=[expr(0)];while(tokens[at]===','){at++;args.push(expr(0))}if(tokens[at++]!==')')throw Error('函数括号不匹配');return funcs[t](...args)}if(t&&Object.hasOwn(vars,t))return num(vars[t]);throw Error('未知变量 '+(t||''))}const prec={'or':1,'and':2,'==':3,'!=':3,'>':4,'<':4,'>=':4,'<=':4,'+':5,'-':5,'*':6,'/':6,'^':7};function expr(min){let a=primary();while(tokens[at] in prec&&prec[tokens[at]]>=min){const op=tokens[at++],b=expr(prec[op]+(op==='^'?0:1));a=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:op==='/'?a/b:op==='^'?a**b:op==='>'?+(a>b):op==='<'?+(a<b):op==='>='?+(a>=b):op==='<='?+(a<=b):op==='=='?+(a===b):op==='!='?+(a!==b):op==='and'?+(a&&b):+(a||b)}if(min===0&&tokens[at]==='?'){at++;const yes=expr(0);if(tokens[at++]!==':')throw Error('条件表达式缺少冒号');const no=expr(0);a=a?yes:no}return a}const result=expr(0);if(at!==tokens.length||!Number.isFinite(result))throw Error('表达式无效或结果不是有限数值');return result}
function leagueStandings(g){const rows=new Map();for(const e of state.events.filter(e=>e.finalized&&g.eventIds.includes(e.id))){const prizes=payoutAmounts(e);for(const x of e.entries){let points=0;const vars={p:e.entries.length,n:e.transactions.filter(t=>t.type==='买入'||t.type==='重入').length,f:x.rank,k:x.knockouts,r:x.reentries,a:x.addons,w:prizes[x.rank-1]||0,b:e.config.buyin,c:e.transactions.filter(t=>t.playerId===x.playerId).reduce((s,t)=>s+t.amount,0),z:stats(e).pool,m:e.config.payouts.length,x:(x.reentries||0)+1};try{points=g.scoring==='fixed'?(x.rank===1?100:x.rank===2?70:x.rank===3?50:10):g.scoring==='sqrt'?Math.sqrt(vars.p)/vars.f*10:g.scoring==='custom'?formula(g.formula,vars):vars.p-vars.f+1}catch(err){return '<p class="badge red">计分公式无效，请编辑联赛配置。</p>'}const r=rows.get(x.playerId)||{id:x.playerId,points:0,events:0,wins:0};r.points+=points;r.events++;r.wins+=x.rank===1?1:0;rows.set(x.playerId,r)}}return rows.size?table(['排名','玩家','积分','参赛','冠军'],Array.from(rows.values()).sort((a,b)=>b.points-a.points||b.wins-a.wins||a.id.localeCompare(b.id)).map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(playerName(r.id))+'</td><td>'+fmt(r.points)+'</td><td>'+r.events+'</td><td>'+r.wins+'</td></tr>')):'<p class="muted">关联赛事正式确认后显示积分。</p>'}

function calculateTool(kind,d){let html='';if(kind==='pool'){const n=num(d.players),buy=num(d.buyin),fee=num(d.rake),p=d.percent.split(/[,，]/).map(num);if(fee>buy||n<1||p.some(v=>v<0)||Math.abs(p.reduce((a,b)=>a+b,0)-100)>.01)throw Error('请检查人数、服务费和比例（合计须为 100%）');const pool=n*(buy-fee);html='<strong>'+money(pool)+'</strong> 可分配奖池'+table(['名次','比例','奖金'],p.map((v,i)=>'<tr><td>第 '+(i+1)+' 名</td><td>'+v+'%</td><td>'+money(pool*v/100)+'</td></tr>'))}if(kind==='blinds'){const count=Math.max(4,Math.min(40,Math.round(num(d.hours)*60/num(d.minutes)))),end=num(d.players)*num(d.stack)/20,start=Math.max(1,Math.round(num(d.stack)/125/2)),ls=Array.from({length:count},(_,i)=>{const bb=Math.max(2,Math.round(start*2*Math.pow(Math.max(1,end/(start*2)),i/(count-1))/50)*50);return {small:Math.round(bb/2),big:bb,ante:i<4?0:bb,minutes:num(d.minutes)}});html=levelsTable(ls)}if(kind==='chips'){const c=state.chipsets.find(x=>x.id===d.chipsetId);if(!c)throw Error('请先新建筹码组');const total=num(d.stack);if(!Number.isInteger(total)||total<1||total>1000000)throw Error('起始筹码须为 1 到 1000000 的整数');const chips=c.chips.slice().sort((a,b)=>b.value-a.value);if(chips.some(x=>!Number.isInteger(x.value)||x.value<1))throw Error('面值须为正整数');const dp=new Int32Array(total+1);dp.fill(-1);dp[0]=0;for(let a=1;a<=total;a++)for(let i=0;i<chips.length;i++){const prev=a-chips[i].value;if(prev>=0&&dp[prev]>=0){dp[a]=i+1;break}}if(dp[total]<0){html='<p>现有面值无法精确组成 '+fmt(total)+' 筹码。</p>'}else{const counts=Array(chips.length).fill(0);let rest=total;while(rest>0){const i=dp[rest]-1;counts[i]++;rest-=chips[i].value}html=table(['颜色','面值','数量'],chips.map((ch,i)=>'<tr><td>'+esc(ch.label)+'</td><td>'+fmt(ch.value)+'</td><td>'+counts[i]+'</td></tr>'))+'<p>精确组成 '+fmt(total)+' 筹码。</p>'}}if(kind==='icm'){const stacks=d.stacks.split(/[,，]/).map(num),prizes=d.prizes.split(/[,，]/).map(num);if(stacks.length>12||stacks.some(x=>x<=0)||prizes.some(x=>x<0)||prizes.length>stacks.length)throw Error('最多 12 人，筹码须为正数，奖项数不超过人数');const n=stacks.length,dp=new Map([[0,1]]),equity=Array(n).fill(0),full=1<<n;for(let mask=0;mask<full;mask++){const probability=dp.get(mask)||0;let count=0,sum=0;for(let i=0;i<n;i++)if(mask&(1<<i))count++;else sum+=stacks[i];if(count>=prizes.length)continue;for(let i=0;i<n;i++)if(!(mask&(1<<i))){const chance=probability*stacks[i]/sum;equity[i]+=chance*prizes[count];const next=mask|(1<<i);dp.set(next,(dp.get(next)||0)+chance)}}html=table(['玩家','筹码','奖金期望'],equity.map((v,i)=>'<tr><td>玩家 '+(i+1)+'</td><td>'+fmt(stacks[i])+'</td><td>'+money(v)+'</td></tr>'))+'<p>奖金期望合计：'+money(equity.reduce((a,b)=>a+b,0))+'</p>'}$('#tool-result').innerHTML='<div class="tool-result">'+html+'</div>'}

function parseCSV(text){const rows=[];let row=[],v='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(quote)throw Error('CSV 引号未闭合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('需要表头和至少一行数据');const header=rows.shift().map(x=>x.replace(/^\uFEFF/,'').trim());return rows.map((r,i)=>{if(r.length!==header.length)throw Error('第 '+(i+2)+' 行列数与表头不符');return Object.fromEntries(header.map((h,j)=>[h,r[j].trim()]))})}

function advanceLevel(e){const wasRunning=e.running,base=wasRunning?e.deadline:Date.now();if(e.onBreak){e.onBreak=false;if(e.breakAfterLevel){e.level=Math.min(e.level+1,e.config.levels.length-1);e.remaining=e.config.levels[e.level].minutes*60}else e.remaining=e.resumeSeconds||e.config.levels[e.level].minutes*60;e.breakAfterLevel=false}else if(e.config.levels[e.level].breakAfter){e.onBreak=true;e.breakAfterLevel=true;e.remaining=e.config.levels[e.level].breakAfter*60}else if(e.level<e.config.levels.length-1){e.level++;e.remaining=e.config.levels[e.level].minutes*60}else{e.running=false;e.remaining=0;e.status='paused';return}if(e.config.pauseEachLevel&&!e.onBreak)e.running=false;e.deadline=(wasRunning?base:Date.now())+e.remaining*1000;if(e.config.voice)speak(e.onBreak?'现在进入休息时间':'现在进入第'+(e.level+1)+'级盲注')}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(b){if(b.disabled)return;event.preventDefault();try{const p=actions[b.dataset.action]?.(b);if(p?.catch)p.catch(e=>toast(e.message,true));if(!actions[b.dataset.action])toast('未找到操作：'+b.dataset.action,true)}catch(e){console.error(e);toast(e.message,true)}return}const scroll=event.target.closest('[data-scroll]');if(scroll){event.preventDefault();$('#'+scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}const tab=event.target.closest('[data-control]');if(tab){event.preventDefault();controlTab=tab.dataset.control;render();return}if(event.target.closest('a[href^="#"]')){$('#account').innerHTML='';closeModal();$('#sidebar').classList.remove('mobile-open')}else if(!event.target.closest('#account'))$('#account').innerHTML='';if(event.target.classList.contains('modal-backdrop'))closeModal()});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;try{if(form.id==='modal-form'){dialogSubmit?.(formData(form));return}if(form.id==='config-form'){saveEvent();return}const d=formData(form),kind=form.dataset.form;if(kind==='player'){const id=editPlayerId,p=state.players.find(x=>x.id===id);if(!d.name.trim())return toast('请输入显示名称',true);mutate(p?'编辑玩家档案':'新增玩家档案',()=>{if(p)Object.assign(p,d,{name:d.name.trim()});else state.players.push(Object.assign(d,{id:uid(),name:d.name.trim(),createdAt:new Date().toISOString()}))});editPlayerId='';render();toast('玩家已保存')}else if(kind==='org'||kind==='financials'||kind==='integration'){if(kind==='integration'&&d.webhook&& !/^https:\/\//.test(d.webhook))return toast('接收地址仅支持 HTTPS',true);mutate('保存'+({org:'门店',financials:'财务',integration:'集成'}[kind])+'设置',()=>Object.assign(state.settings,d));render();toast('配置已保存到本地')}else if(kind==='tool')calculateTool(form.dataset.tool,d);else if(kind==='import')importCSV(d.csv,form.dataset.kind)}catch(e){console.error(e);toast(e.message,true)}});
document.addEventListener('input',event=>{const x=event.target;if(x.id==='player-search')$('#player-table').innerHTML=playerTable(x.value);if(x.name==='audit-query')filterAudit()});
function filterAudit(){$('#audit-table').innerHTML=auditTable($('[name="audit-event"]').value,$('[name="audit-query"]').value,$('[name="audit-range"]').value)}
document.addEventListener('change',async event=>{const x=event.target;try{if(x.dataset.profileEnable){const input=$('[name="v_'+x.dataset.profileEnable+'"]');input.disabled=!x.checked;return}if(x.hasAttribute('data-autosave')){mutate('修改赛事功能开关',()=>state.settings[x.name.split('.')[1]]=x.checked);if(x.name==='settings.voice')refreshKeepScroll();return}if(x.name.startsWith('event-')){const e=getEvent(x.dataset.event);mutate('修改本场展示选项',()=>e.config[x.name.slice(6)]=x.checked,e.id);return}if(x.name.startsWith('displayEvent_')){const id=x.name.slice(13);mutate('切换显示屏关联赛事',()=>state.displays.find(d=>d.id===id).eventId=x.value);toast('展示内容已切换');return}if(x.id==='logo-upload'&&x.files[0]){const file=x.files[0];if(file.size>2*1024*1024)return toast('图片不能超过 2 MB',true);if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type))return toast('请选择 PNG、JPG、WebP 或 SVG 图片',true);const reader=new FileReader();reader.onload=()=>{mutate('更新门店标志',()=>state.settings.logo=reader.result);render()};reader.readAsDataURL(file);return}if(x.id==='restore-file'&&x.files[0]){const restored=restoreBackup(JSON.parse(await x.files[0].text()));confirmLocal('恢复本地备份','恢复后将替换当前本地数据。请先导出当前备份。',()=>{state=restored;undoStack=[];save();render()});return}if(x.id==='import-file'&&x.files[0]){const text=await x.files[0].text();if(x.files[0].name.endsWith('.json')){const data=JSON.parse(text);if(x.dataset.kind==='events'&&data.events){const rs=data.events;rs.forEach(e=>{if(!e.config||!e.entries)throw Error('赛事结构不完整')});mutate('从 JSON 导入赛事',()=>rs.forEach(e=>{const copy=clone(e);copy.id=uid();copy.entries=[];copy.transactions=[];copy.finalized=false;copy.running=false;copy.level=0;copy.status='setup';copy.remaining=copy.config.levels[0].minutes*60;state.events.push(copy)}));navigate('dashboard')}else throw Error('请在数据设置中使用完整 JSON 备份恢复')}else importCSV(text,x.dataset.kind);return}if(x.name.startsWith('audit-')){filterAudit();return}if(x.name==='dealer-event'){navigate('dealer/'+x.value);return}if(x.closest('#config-form')){syncDraft();if(['format','addonEnabled','bountyEnabled','lateEnabled'].includes(x.name)){refreshKeepScroll();return}if(x.name==='game'){if(x.value!=='MIXED')draft.levels.forEach(l=>l.game=x.value);return}if(x.name==='bountyType'){refreshKeepScroll();return}if(x.name==='preset'&&x.value!=='custom'){draft.duration=x.value==='turbo'?10:x.value==='deep'?30:20;draft.levels=levels(x.value,draft.stack,draft.duration);draft.levels.forEach(l=>l.game=draft.game==='MIXED'?'NLHE':draft.game);refreshKeepScroll();return}if(x.name==='ante'||x.name==='anteStart'){draft.levels.forEach((l,i)=>l.ante=x.value==='none'||draft.ante==='none'||i+1<draft.anteStart?0:draft.ante==='traditional'?Math.round(l.big/10):l.big);refreshKeepScroll();return}if(x.name==='duration'){draft.levels.forEach(l=>l.minutes=num(x.value));refreshKeepScroll();return}if(x.name==='levelCount'){const count=Math.max(1,Math.min(50,num(x.value)));if(count<draft.levels.length)draft.levels.length=count;else while(draft.levels.length<count){const last=draft.levels.at(-1);draft.levels.push(Object.assign({},last,{id:uid(),small:last.small*2,big:last.big*2,breakAfter:0}))}refreshKeepScroll();return}if(x.name==='payoutPreset'){const p={standard:[50,30,20],top:[60,25,15],flat:[40,30,20,10],winner:[100]}[x.value];if(p)draft.payouts=p.map((percent,i)=>({place:'第 '+(i+1)+' 名',percent}));refreshKeepScroll();return}if(x.name.startsWith('payout_')||['buyin','rake','estimated','guarantee'].includes(x.name)){refreshKeepScroll();return}}}catch(e){console.error(e);toast(e.message,true)}});
let draggingChip=-1;
document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-chip-index]');if(row){syncChips();draggingChip=num(row.dataset.chipIndex);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-chip-index]'))e.preventDefault()});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-chip-index]');if(row&&draggingChip>=0){e.preventDefault();const target=num(row.dataset.chipIndex),item=chipDraft.splice(draggingChip,1)[0];chipDraft.splice(target,0,item);draggingChip=-1;$('#chip-editor').innerHTML=chipEditor()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#account').innerHTML=''}if(e.key===' '&&route.startsWith('control/')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!$('#modal-form')){e.preventDefault();const b=$('[data-action="clock-toggle"]');if(b)actions['clock-toggle'](b)}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo(0,0)});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const next=JSON.parse(e.newValue);if(next.version===VERSION){state=next;if(!$('#config-form')&&!$('#modal-form'))render()}}catch(err){console.warn('本地数据更新无法解析')}}});
function tick(){let changed=false;if(!route.startsWith('tv/')){for(const e of state.events){if(!e.running||e.finalized)continue;if(remaining(e)===60&&e.warningKey!==e.level+':'+e.onBreak){e.warningKey=e.level+':'+e.onBreak;if(state.settings.audio)beep();if(e.config.voice)speak('本级别还剩一分钟')}let safety=0;while(e.running&&remaining(e)===0&&safety++<50){advanceLevel(e);changed=true;state.logs.unshift({id:uid(),time:new Date().toISOString(),actor:'本地赛钟',action:e.onBreak?'自动进入休息':'自动升盲',eventId:e.id})}}if(changed){if(state.settings.audio)beep();state.revision++;save();if(!$('#modal-form')&&!$('#config-form'))render()}}$$('[data-clock]').forEach(el=>{const e=getEvent(el.dataset.clock);if(e)el.textContent=clockText(remaining(e))});$$('[data-now]').forEach(el=>el.textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}));}
setInterval(tick,500);
render();tick();
</script></body></html>
