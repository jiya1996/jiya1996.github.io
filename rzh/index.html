    hand: () => { const seconds = Number(state.preferences.handSeconds); hand = { running: state.preferences.handAuto, remaining: seconds, deadline: Date.now() + seconds * 1000 }; renderOverlays(); },
    'hand-toggle': () => { if (!hand) return; if (hand.running) hand.remaining = Math.max(0, (hand.deadline - Date.now()) / 1000); else hand.deadline = Date.now() + hand.remaining * 1000; hand.running = !hand.running; fire(hand.running ? 'HandTimerUnpause' : 'HandTimerPause'); renderOverlays(); },
    'hand-add': (id, value) => { if (!hand) return; const seconds = hand.running ? Math.max(0, (hand.deadline - Date.now()) / 1000) : hand.remaining; hand.remaining = Math.max(0, seconds + Number(value)); hand.deadline = Date.now() + hand.remaining * 1000; renderOverlays(); },
    'hand-reset': () => { if (hand) { hand.remaining = Number(state.preferences.handSeconds); hand.deadline = Date.now() + hand.remaining * 1000; renderOverlays(); } },
    'hand-close': () => { hand = null; renderOverlays(); },
  });
  function localDateTime(timestamp) { const date = new Date(timestamp); return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
  function currentScreenSet() { return [...state.layout.screenSets].sort((left, right) => right.priority - left.priority).find(item => { try { return TD.formula(item.condition || 'true', formulaVariables()); } catch { return false; } }) || state.layout.screenSets[0]; }
  function cycleScreen(direction, automatic = false) {
    const available = automatic ? currentScreenSet()?.screens || [] : state.layout.screens.map(item => item.id); if (!available.length) return;
    const position = available.indexOf(state.layout.currentScreen); const next = available[(position + direction + available.length) % available.length];
    state.layout.currentScreen = next; rotatedAt = Date.now(); if (!automatic) state.layout.locked = true; save(); render();
    const element = document.querySelector('.display-content'); if (element && state.layout.transition !== 'none') element.animate(state.layout.transition === 'fade' ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateX(30px)', opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 450 });
  }
  const displayWindows = new Set();
  function receive(incoming) { if (!incoming || incoming.writerId === writerId || !incoming.state) return; try { state = TD.validateState(incoming.state); render(); } catch (error) { notify(`同步数据无效：${error.message}`, true); } }
  nativeChannel?.addEventListener('message', event => receive(event.data));
  window.addEventListener('storage', event => { if (event.key === storageKey && event.newValue) { try { receive({ state: JSON.parse(event.newValue) }); } catch { notify('收到无效的跨窗口数据', true); } } });
  window.addEventListener('message', event => { if (event.data?.type === 'td-state' && (event.source === window.opener || displayWindows.has(event.source)) && (event.origin === location.origin || location.origin === 'null')) receive(event.data); });
  document.addEventListener('click', event => {
    const element = event.target.closest('[data-action]'); if (!element) return;
    event.preventDefault(); const action = actions[element.dataset.action]; if (!action) return notify(`此操作未定义：${element.dataset.action}`, true);
    try { const result = action(element.dataset.id || '', element.dataset.value || ''); if (result?.catch) result.catch(error => notify(error.message, true)); } catch (error) { const errorBox = document.querySelector('#form-error'); if (document.querySelector('#modal').open && errorBox) errorBox.textContent = error.message; else notify(error.message, true); }
  });
  document.addEventListener('submit', event => {
    event.preventDefault(); const element = event.target; const values = readForm(element);
    try {
      if (element.id === 'dialog-form') { if (formHandler) formHandler(values); document.querySelector('#modal').close(); }
      else if (element.id === 'game-form') {
        TD.formula(values.playingFormula, { n: 10, r: 1, nr: 0, na: 0, hits: 0, chips: 0 });
        change('应用赛事配置', current => { for (const key of ['title', 'description', 'notes', 'league', 'season']) current[key] = values[key]; for (const key of Object.keys(current.config)) if (Object.hasOwn(values, key)) current.config[key] = values[key]; }); notify('赛事设置已应用');
      } else if (element.id === 'preferences-form') {
        for (const key of ['playerFields', 'dashboardItems', 'tabOrder', 'salesPeople']) if (Object.hasOwn(values, key)) values[key] = values[key].split(',').map(item => item.trim()).filter(Boolean);
        if (Object.hasOwn(values, 'statusUrl') && values.statusUrl && values.statusUrl !== state.preferences.statusUrl) {
          const captured = TD.clone(values);
          confirmAction('启用定时状态输出', `保存后将每 ${values.statusOutputSeconds} 秒向 ${escape(values.statusUrl)} 发送公开赛事状态和玩家姓名。`, () => { change('保存偏好并启用状态输出', current => Object.assign(current.preferences, captured)); statusUrlWarning = false; }); return;
        }
        change('保存偏好设置', current => Object.assign(current.preferences, values)); notify('偏好设置已保存');
      }
    } catch (error) { const output = document.querySelector('#form-error'); if (element.id === 'dialog-form' && output) output.textContent = error.message; else notify(error.message, true); }
  });
  document.addEventListener('change', event => {
    const input = event.target;
    if (input.dataset.select) { if (input.checked) selected.add(input.dataset.select); else selected.delete(input.dataset.select); const count = document.querySelector('.table-tools .count'); if (count) count.textContent = `名单 ${state.players.length} 人 · 已选 ${selected.size} 人`; }
    if (input.id === 'mute-toggle') change('切换静音', current => { current.preferences.mute = input.checked; });
    if (input.id === 'volume') { state.preferences.volume = Number(input.value); save(); }
  });
  document.addEventListener('input', event => { if (event.target.id !== 'player-search') return; const cursor = event.target.selectionStart; search = event.target.value; render(); const input = document.querySelector('#player-search'); input?.focus(); input?.setSelectionRange(cursor, cursor); });
  document.addEventListener('keydown', event => {
    if (event.target.closest('input,textarea,select,[contenteditable]')) return;
    if (document.querySelector('#modal').open) return;
    if (event.key === 'Enter' && event.target.matches('[data-action]')) { event.target.click(); return; }
    const key = `${event.ctrlKey || event.metaKey ? 'Ctrl+' : ''}${event.altKey ? 'Alt+' : ''}${event.shiftKey ? 'Shift+' : ''}${event.key.length === 1 ? event.key.toLowerCase() : event.key}`;
    const action = state.preferences.hotkeys[key] || state.preferences.hotkeys[event.key];
    if (state.layout.keyboardLocked && action !== 'keyboard') return;
    if (/^[1-6]$/.test(event.key) && !event.ctrlKey && !event.metaKey) { const screen = state.layout.screens[Number(event.key) - 1]; if (screen) safe(() => actions['screen-select'](screen.id)); return; }
    if (action && actions[action]) { event.preventDefault(); safe(() => actions[action]()); }
  });
  document.addEventListener('dragstart', event => { const seat = event.target.closest('[data-player]'); if (seat?.dataset.player) event.dataTransfer.setData('text/plain', seat.dataset.player); });
  document.addEventListener('dragover', event => { if (event.target.closest('.seat[data-action]')) event.preventDefault(); });
  document.addEventListener('drop', event => {
    const seat = event.target.closest('.seat[data-action]'); if (!seat) return; event.preventDefault(); const id = event.dataTransfer.getData('text/plain');
    safe(() => change('拖拽玩家调整座位', current => { const player = TD.findPlayer(current, id); const occupant = TD.active(current).find(item => item.tableId === seat.dataset.id && item.seat === Number(seat.dataset.value)); if (player.locked || occupant?.locked) throw new Error('锁定玩家不能拖动或被交换'); TD.seatPlayer(current, player, seat.dataset.id, Number(seat.dataset.value), true); }));
  });
  function isLeader() {
    try { const lease = JSON.parse(localStorage.getItem('td-html-clock-leader') || 'null'); const now = Date.now(); if (!lease || lease.writerId === writerId || now - lease.time > 1800) { localStorage.setItem('td-html-clock-leader', JSON.stringify({ writerId, time: now })); return true; } return false; } catch { return !displayMode || !window.opener || window.opener.closed; }
  }
  setInterval(() => {
    const now = Date.now(); const second = Math.floor(now / 1000); const leader = isLeader();
    if (leader) {
      const emitted = TD.tick(state, now);
      if (emitted.length) { TD.addHistory(state, '时钟自动切换级别'); save(); render(); emitted.forEach(trigger => fire(trigger)); }
      if (second !== lastSecond) { if (state.clock.running) fire('ClockTick'); else if (second % 30 === 0) fire('ClockPaused'); if (advanceMessages()) save(); if (state.preferences.autosave && now - lastSave >= Math.max(2, Number(state.preferences.saveEvery)) * 1000) save();
        if (state.layout.rotate && !state.layout.locked) { const screen = state.layout.screens.find(item => item.id === state.layout.currentScreen); if (now - rotatedAt >= Number(screen?.duration || 30) * 1000) cycleScreen(1, true); }
        if (state.preferences.statusUrl && now - lastStatusOutput >= Math.max(2, Number(state.preferences.statusOutputSeconds)) * 1000) { lastStatusOutput = now; sendStatus().catch(error => { if (!statusUrlWarning) { statusUrlWarning = true; notify(`状态输出不可用，本地赛事继续：${error.message}`, true); } }); }
      }
    }
    document.querySelectorAll('[data-clock]').forEach(element => { element.textContent = clockText(TD.remaining(state, now)); }); document.querySelectorAll('[data-walltime]').forEach(element => { element.textContent = time(now); });
    if (hand?.running && hand.deadline <= now) { hand.running = false; hand.remaining = 0; beep('warning'); queueMessage('手牌计时已到', 3); }
    if (hand && second !== lastSecond) fire('HandTimerTick');
    if (second !== lastSecond || hand) { renderOverlays(); if (displayMode && state.preferences.screenSaver && second % 600 === 0) document.querySelector('.display-app')?.animate([{ filter: 'invert(1)' }, { filter: 'invert(0)' }], { duration: 1800 }); }
    lastSecond = second;
  }, 250);
  window.addEventListener('beforeunload', () => { if (state.preferences.autosave) save(); try { const lease = JSON.parse(localStorage.getItem('td-html-clock-leader') || 'null'); if (lease?.writerId === writerId) localStorage.removeItem('td-html-clock-leader'); } catch {} });
  window.App = { get state() { return state; }, actions, render, change, save, statusPayload, get tab() { return tab; } };
  render();
  if (storageFailure) notify(storageFailure, true);
})();
</script>
