function log(action,detail={},table=UI.table){D.logs.push({id:uid(),action,detail:clone(detail),table,account:who()?.id||'display',operator:who()?.name||'本地外屏预览',at:now()})}
function save(){try{D=RZHBridge.mergeProfiles(D);const value=JSON.stringify(D);localStorage.setItem(KEY,value);lastGoodState=value;return true}catch{D=JSON.parse(lastGoodState);const err=new Error('本地保存失败，操作未确认成功；请检查浏览器存储后重试');err.name='StorageFailure';throw err}}
function reload(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){D=RZHBridge.mergeProfiles(x);lastGoodState=JSON.stringify(D)}}catch{}}
function valid(){if(!who())return false;if(D.tokens[who().id]!==session.token){session=null;sessionStorage.removeItem(KEY+'-session');modalClose();render();toast('账号已在其他窗口登录，当前窗口已退出');return false}return true}
function assertGame(id){if(!valid())return null;const g=G(id);if(!g||g.status!=='active'||g.account!==who().id||!who().tables.includes(g.table)){toast('场次或权限已变化，请重新核对');return null}return g}
function draft(){if(!D.drafts[who().id])D.drafts[who().id]={table:UI.table,seats:{},levels:baseLevels()};let x=D.drafts[who().id];if(x.table!==UI.table)x=D.drafts[who().id]={table:UI.table,seats:{},levels:baseLevels()};return x}
function stages(levels){return levels.flatMap((l,i)=>[{kind:'level',level:i+1,sb:l.sb,bb:l.bb,duration:l.minutes*60},...(l.rest>0&&i<levels.length-1?[{kind:'break',after:i+1,duration:l.rest*60}]:[])])}
function tickClocks(){let changed=false;for(const g of D.games){if(g.status!=='active'||g.clock.paused||g.clock.mode==='sustain')continue;let safety=0;while(g.clock.deadline<=now()&&safety++<200){changed=true;const c=g.clock;g.undo=null;c.rev++;if(c.index+1>=g.stages.length){c.mode='sustain';c.deadline=null;c.remaining=null;break}const oldDeadline=c.deadline;c.index++;c.deadline=oldDeadline+g.stages[c.index].duration*1000;c.remaining=g.stages[c.index].duration}}if(changed)save();return changed}
function toast(msg){clearTimeout(toastTimer);document.getElementById('toasts').innerHTML=`<div class="toast">${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toasts').innerHTML='',3600)}
function modal(title,html,footer=''){document.getElementById('modal').innerHTML=`<div class="sheet-back"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="close" aria-label="关闭" onclick="App.close()">${icon('close')}</button></div>${html}<div class="err" id="formError" role="alert"></div>${footer?`<div class="buttons">${footer}</div>`:''}</section></div>`;setTimeout(()=>document.querySelector('.sheet input:not([type=checkbox]),.sheet textarea')?.focus(),50)}
function error(msg){const e=document.getElementById('formError');if(e)e.textContent=msg;else toast(msg)}function modalClose(){document.getElementById('modal').innerHTML='';modalState=null;formDraft=null}function field(id){return document.getElementById(id)?.value||''}

function dealerGuide(){return `<div class="dealer-guide" role="img" aria-label="荷官位于牌桌上方长边中间，面向桌内；本人左手在画面右侧对应1号位，本人右手在画面左侧对应9号位"><svg class="dealer-arrows" viewBox="0 0 360 88" preserveAspectRatio="none" aria-hidden="true"><path d="M128 66Q110 74 96 62m0 0 3 6m-3-6 7 1M232 66Q250 74 264 62m0 0-3 6m3-6-7 1" fill="none" stroke="var(--metal-text)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="dealer-portrait"><img class="dealer-figure" src="${DEALER_FIGURE_SRC}" width="450" height="338" alt="" aria-hidden="true" draggable="false"><span class="dealer-caption">荷官</span></div></div>`}
function mapHTML(seats,interactive=true){return `<div class="table-map"><div class="seat-ring"><div class="felt"></div><div class="felt-text"><small>TABLE ${String(UI.table).padStart(2,'0')}</small><strong>joker</strong><small>TOURNAMENT CLUB</small></div>${Object.entries(POS).map(([n,[x,y]])=>{const p=P(seats[n]);return `<button class="seat ${p?'filled':''}" style="left:${x}%;top:${y}%" ${interactive?`onclick="App.seat(${n})"`: 'disabled'} aria-label="${n}号位${p?' '+esc(p.name):' 空位'}"><span class="circle">${p?esc(p.name.slice(-1)):icon('plus')}</span><span class="seatname">${p?esc(p.name):'待入座'}</span><span class="seatnum">${n}号位</span></button>`}).join('')}</div>${dealerGuide()}</div>`}
function icon(name){const names={palette:'settings',table:'cards',people:'users',records:'history'};return window.RZHArt.icon(names[name]||name,20)}
function brandMark(){return window.RZHArt.brand()}
function dealerCrest(){return window.RZHArt.brand()}
function rankArt(i){const art=window.RZHArt.honor(['冠军','亚军','季军'][i],0).replace(' is-locked','').replace(/ role="img" aria-label="[^"]*"/,' aria-hidden="true"');return `<span class="rank-art" aria-hidden="true">${art}</span>`}
function header(){return `<header class="top"><div class="topbar"><div class="header-brand">${brandMark()}<b>joker</b><span class="role-label">荷官端</span></div><div class="header-actions"><button class="icon-button" aria-label="选择界面风格" title="${esc(theme.name)}" onclick="App.themes()">${icon('palette')}<span>风格</span></button></div></div>${who()?`<div class="session-strip"><span>${esc(D.store.name)} · ${esc(who().name)}</span><button onclick="App.logout()">退出</button></div>`:''}</header>`}
function nav(){return `<nav class="nav" aria-label="荷官工作台导航">${[['table','工作台','table'],['arrival','今日到店','people'],['records','发布记录','records']].map(([tab,label,svg])=>`<button class="${UI.tab===tab?'active':''}" aria-label="${label}" ${UI.tab===tab?'aria-current="page"':''} onclick="App.tab('${tab}')">${icon(svg)}<span>${label}</span></button>`).join('')}</nav>`}
function loginHTML(){return `<div class="login"><div class="auth-art">${dealerCrest()}</div><div class="auth-title"><div class="eyebrow">JOKER TOURNAMENT CLUB</div><h1>登录荷官工作台</h1><p>使用本店员工账号，继续你的场内工作。</p></div><form onsubmit="App.login(event)"><label for="account">员工账号</label><input id="account" autocomplete="username" value="dealer01" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" value="demo123" required><div class="err" id="loginError"></div><button class="primary wide" type="submit">登录</button></form><div class="auth-links"><button class="link" onclick="App.loginHelp()">登录遇到问题</button><button class="link" onclick="App.themes()">${esc(theme.name)} ›</button></div><div class="demo-note"><strong>本地交互原型 · 演示账号</strong><br>dealer01 / demo123<br>玩家、次数及记录均为虚构数据</div><div class="auth-footer">门店员工账号独立使用 · joker</div></div>`}
function tableHTML(){const active=activeGame();if(active){UI.table=active.table;return gameHTML(active)}if(!UI.selected)return `<div class="row between mb"><h1>我的工作台</h1><span class="badge good">已登录</span></div><p class="muted mb">${esc(biz())} 营业日 · 仅显示已授权桌台</p><button class="table-select card mb" onclick="App.arrivals()"><span class="table-no">${arrived().length}</span><div class="grow"><strong>今日到店</strong><small class="muted" style="display:block">按玩家身份去重，手工确认</small></div><span>＋</span></button><div class="section-head"><h2>选择本桌</h2></div><div class="stack">${who().tables.map(t=>{const g=D.games.find(g=>g.table===t&&g.status==='active');return `<button class="table-select" onclick="App.chooseTable(${t})"><span class="table-no">${String(t).padStart(2,'0')}</span><div class="grow"><strong>${t}号桌</strong><small class="muted" style="display:block">${g?'比赛进行中 · '+esc(ACCOUNTS[g.account]?.name||g.account):'可准备新一场'}</small></div><span>›</span></button>`}).join('')}</div>`;
const g=tableGame(),pres=D.presentations[UI.table];if(g?.status==='finished'&&pres?.game===g.id&&pres.mode==='result')return resultHTML(g);
const dr=draft(),count=Object.keys(dr.seats).length;return `<div class="row between mb"><div><small>开局准备</small><h1>${UI.table}号桌</h1></div><button class="link" onclick="App.backTables()">换桌</button></div><div class="row between"><button class="chip" onclick="App.arrivals()">今日到店 ${arrived().length} 人 ＋</button><span class="badge">未扣参赛次数</span></div>${mapHTML(dr.seats)}<div class="countbar"><span>已安排 ${count}/9 人</span><span>至少3人才能开局</span></div><div class="card mt"><div class="row between"><div><strong>盲注与休息</strong><small style="display:block">${dr.levels.length}级 · 每级 ${dr.levels[0]?.minutes||0} 分钟起</small></div><button class="chip" onclick="App.rules()">设置</button></div></div><button class="primary wide mt" onclick="App.startPreview()" ${count<3?'disabled':''}>确认开局 · ${count} 人各扣1次</button><p class="note mt">核对消费、人员与位置后再开局。筹码由现场安排，程序不记录筹码。</p><button class="link" onclick="App.backTables()">返回桌台</button>`}
function gameHTML(g){const s=g.stages[g.clock.index],c=activeEntries(g).length,undo=g.undo&&g.undo.expectedRev===g.clock.rev;return `<div class="row between mb"><div><small>本场 ${esc(g.label)}</small><h1>${g.table}号桌</h1></div><button class="link" onclick="App.display()">外屏演示 ↗</button></div><div class="row between"><button class="chip" onclick="App.arrivals()">今日到店 ${arrived().length} 人 ＋</button><span class="badge ${g.clock.paused?'':'good'}">${g.clock.paused?'已暂停':g.clock.mode==='sustain'?'最后级持续':s.kind==='break'?'休息中':'比赛进行中'}</span></div>${mapHTML(Object.fromEntries(activeEntries(g).map(e=>[e.seat,e.pid])))}<div class="countbar"><span>当前在赛 ${c} 人</span><span>本场参赛 ${uniquePlayers(g).length} 人</span></div><div class="control"><button class="primary" onclick="App.pause('${g.id}')">${g.clock.paused?'继续比赛':'暂停比赛'}</button><button onclick="App.more('${g.id}')">更多 ···</button></div>${undo?`<div class="notice mt row between"><small>刚刚手动切换了级别</small><button class="chip" onclick="App.undo('${g.id}')">恢复上次切换</button></div>`:''}<div class="actions mt"><button onclick="App.compose()">赛事播报</button><button onclick="App.entries()">本场玩家</button></div><button class="wide mt" onclick="App.rank()">确认前三名并结赛</button><p class="note mt">盲注按配置自动推进。详细级别、大小盲及剩余时间在外屏展示。</p>`}
function resultHTML(g){return `<div class="row between mb"><div><small>${esc(g.label)} · 已正式结束</small><h1>本场结果</h1></div><span class="badge good">已保存</span></div><div class="card">${g.result.pids.map((pid,i)=>`<div class="rank"><span class="medal">${rankArt(i)}</span><div class="grow"><strong>${esc(matchPlayerLabel(g,pid))}</strong><small style="display:block">${['冠军','亚军','季军'][i]}</small></div></div>`).join('')}<p class="note mt">${dateTime(g.result.at)} · 有效版本 ${g.result.version}<br>正式名次由商家后台有权限的管理人员填写原因后更正。</p></div><button class="wide mt" onclick="App.replayResult('${g.id}')">重播结赛演出</button><button class="primary wide mt" onclick="App.nextGame()">准备下一场</button><button class="link mt" onclick="App.backTables()">返回工作台</button>`}
function arrivalsPage(){return `<div class="row between mb"><div><small>${esc(biz())} 营业日</small><h1>今日到店</h1></div><button class="primary" onclick="App.arrivals()">＋ 确认到店</button></div><div class="notice mb">有效到店 ${arrived().length} 人 · 本营业日同一玩家只计一次</div>${arrived().length?arrived().map(p=>playerRow(p,`<button class="chip" onclick="App.arrivalDetail('${p.id}')">查看</button>`)).join(''):'<div class="empty">还没有确认到店的玩家<br>请点击“确认到店”核对本人</div>'}`}
const statusName={waiting:'30秒缓冲',queued:'待播放',playing:'演示播放中',completed:'演示已播完',cancelled:'已取消',stopped:'已停止',failed:'播放异常'};
function recordsHTML(){const g=currentGame();const records=D.broadcasts.filter(b=>b.table===UI.table&&(UI.recordScope==='game'?b.game===g?.id:b.biz===biz())).sort((a,b)=>b.created-a.created);return `<div class="row between mb"><div><small>${UI.table}号桌</small><h1>发布记录</h1></div>${activeGame()?'<button class="primary" onclick="App.compose()">发布</button>':''}</div><div class="tabs"><button class="${UI.recordScope==='game'?'on':''}" onclick="App.scope('game')">本场</button><button class="${UI.recordScope==='day'?'on':''}" onclick="App.scope('day')">本营业日</button></div><p class="note mb">${UI.recordScope==='day'?esc(biz())+' · 本桌全部发布者':'按当前场次查看，跨营业日仍保留本场记录'}。旧场只读。</p>${records.length?records.map(b=>`<div class="record"><div class="row between"><h3>${esc(b.title)}</h3><span class="badge ${b.status==='failed'?'bad':b.status==='playing'?'play':''}">${statusName[b.status]||b.status}</span></div><p class="note mt">${esc(b.text)}</p>${broadcastPeopleHTML(b)}<small>${esc(G(b.game)?.label)} · ${esc(b.operator)}<br>${dateTime(b.created)} · 完成 ${b.completed}/${b.repeats} 遍${b.status==='waiting'?` · 约<span data-ready="${b.readyAt}">${Math.max(0,Math.ceil((b.readyAt-now())/1000))}秒后可播</span>`:''}</small><div class="mt"><button onclick="App.record('${b.id}')">查看详情</button></div></div>`).join(''):'<div class="empty">这个范围还没有发布记录</div>'}`}
function render(){if(DISPLAY)return renderDisplay();if(who()){const a=activeGame();if(a){UI.table=a.table;UI.selected=true}}document.getElementById('root').innerHTML=`<div class="shell"><main class="phone ${who()?'':'is-login'}">${header()}<section class="content">${who()?(UI.tab==='arrival'?arrivalsPage():UI.tab==='records'?recordsHTML():tableHTML()):loginHTML()}</section>${who()?nav():''}</main></div>`}
// 荷官在一场比赛内统一按座位和昵称识别人；手机号只用于到店核验及尚未分位的选人。
function seatPlayerLabel(seat,pid,status='active'){const previous=status==='eliminated'||status==='void';return `${previous?'原':''}${seat}号位 · ${P(pid).name}${status==='eliminated'?'（已淘汰）':status==='void'?'（误加入已撤销）':''}`}
function matchPlayerInfo(g,pid,entry=null){const entries=g.entries.filter(e=>e.pid===pid&&e.status!=='void'),e=entry||entries.find(e=>e.status==='active')||entries.at(-1)||g.entries.filter(e=>e.pid===pid).at(-1);return e?{pid,seat:e.seat,active:e.status==='active',label:seatPlayerLabel(e.seat,pid,e.status)}:{pid,seat:99,active:false,label:P(pid).name}}
function matchPlayerLabel(g,pid,entry=null){return matchPlayerInfo(g,pid,entry).label}
function matchPlayers(g){return uniquePlayers(g).map(pid=>matchPlayerInfo(g,pid)).sort((a,b)=>Number(b.active)-Number(a.active)||a.seat-b.seat)}
function matchPlayerOptions(g,selected='',optional=false){return `<option value="">${optional?'不选择':'请选择玩家'}</option>${matchPlayers(g).map(p=>`<option value="${p.pid}" ${selected===p.pid?'selected':''}>${esc(p.label)}</option>`).join('')}`}
function playerRow(p,button='',seatLabel=''){const occupied=seatLabel?null:activeFor(p.id),name=seatLabel||(occupied?`${occupied.g.table}号桌 · ${occupied.e.seat}号位 · ${p.name}`:p.name);return `<div class="player row"><span class="avatar">${esc(p.name.slice(-1))}</span><div class="grow"><strong>${esc(name)}</strong><small>${seatLabel?'':esc(p.phone)+' · '}可用 ${p.credits} 次</small></div>${button}</div>`}
function matchPlayerRow(g,pid,button='',entry=null){return playerRow(P(pid),button,matchPlayerLabel(g,pid,entry))}
// 发布记录保留提交时的座位称呼，换座后回看历史也不会把原播报对象认错。
function broadcastPeopleHTML(b){if(b.type==='text')return '';const g=G(b.game),labels=b.playerLabels||{a:matchPlayerLabel(g,b.a),b:b.b?matchPlayerLabel(g,b.b):null};return `<p class="note mt">${b.type==='kill'?'击杀方':'展示玩家'}：${esc(labels.a)}${labels.b?'<br>被击杀方：'+esc(labels.b):''}${b.playerLabels?'':'<br>座位参考本场现有记录'}</p>`}

function editableSeat(n){const g=activeGame();if(g)return g;return draft()}

 submitBroadcast(){const g=assertGame(modalState?.game);if(!g)return;const type=field('broadcastType'),a=field('broadcastA'),b=type==='kill'?field('broadcastB'):'',hand=field('broadcastHand'),body=field('broadcastText').trim(),repeats=type==='text'?Number(field('broadcastRepeats')):1;if(type!=='text'&&!a)return error('请选择玩家');if(type==='kill'&&a===b)return error('双方不能是同一玩家');if(type==='text'&&(!body||!Number.isSafeInteger(repeats)||repeats<1))return error('请填写正文和有效正整数次数');const ids=uniquePlayers(g);if(type!=='text'&&(!ids.includes(a)||(b&&!ids.includes(b))))return error('参赛名单已变化，请重新选择');const text=type==='text'?body:type==='hand'?`${P(a).name}，${hand}`:b?`${P(a).name}击败${P(b).name}`:`为${P(a).name}送上击杀播报`;const t=now(),evt={id:uid(),table:g.table,game:g.id,biz:biz(t),operator:who().name,account:who().id,type,a,b,hand,body,repeats,completed:0,playerLabels:type==='text'?null:{a:matchPlayerLabel(g,a),b:b?matchPlayerLabel(g,b):null},text,title:{kill:'击杀播报',hand:'牌型／特殊手牌',text:'自由文字'}[type],created:t,readyAt:t+30000,status:'waiting',source:modalState?.prefill?.source||null};D.broadcasts.push(evt);log('提交播报',{game:g.id,broadcast:evt.id,type,repeats});save();modalClose();render();toast('已提交，30秒后才可进入播放')},
 record(id){const b=D.broadcasts.find(x=>x.id===id),g=G(b.game),can=g.status==='active'&&g.account===who()?.id;modal('发布详情',`<span class="badge">${statusName[b.status]}</span><h3 class="mt">${esc(b.title)}</h3><p class="mt">${esc(b.text)}</p>${broadcastPeopleHTML(b)}<p class="note mt">${esc(g.label)} · ${esc(b.operator)}<br>提交 ${dateTime(b.created)}<br>计划${b.repeats}遍，完整完成${b.completed}遍${b.error?'<br>异常：'+esc(b.error):''}</p>${!can?'<div class="notice mt">非当前负责的进行中场次，仅查看历史。</div>':''}<div class="stack mt">${can&&['waiting','queued'].includes(b.status)?`<button onclick="App.cancelList('${id}')">进入待播取消</button>`:''}${can&&b.status==='playing'?`<button class="danger" onclick="App.stopBroadcast('${id}')">停止这条当前播报</button>`:''}${can&&['failed','completed','stopped'].includes(b.status)?`<button onclick="App.retryBroadcast('${id}')">${b.status==='failed'?'准备补播未完成次数':'需要时再次发布'}</button>`:''}</div>`)},

 cancelSelected(){const g=activeGame();if(!g)return;const ids=[...document.querySelectorAll('input[name=cancelB]:checked')].map(x=>x.value);if(!ids.length)return error('请先选择待取消的条目');if(ids.some(id=>!['waiting','queued'].includes(D.broadcasts.find(b=>b.id===id)?.status)))return error('有条目已经开始，请刷新核对');ids.forEach(id=>D.broadcasts.find(b=>b.id===id).status='cancelled');log('取消待播',{game:g.id,ids});save();modalClose();render();toast('所选待播已取消，其他条目保持')},
 stopBroadcast(id){const b=D.broadcasts.find(b=>b.id===id);if(!assertGame(b.game))return;if(b.status!=='playing')return error('这条已不在播放，不会停止下一条');b.status='stopped';log('停止当前播报',{game:b.game,broadcast:id,completed:b.completed});save();modalClose();render();toast('已停止这条的剩余播放，不清空其他队列')},

 audit(id){const rows=D.logs.filter(l=>l.table===G(id).table&&(!l.detail.game||l.detail.game===id)).slice(-40).reverse();modal('本场操作记录',rows.length?rows.map(l=>`<div class="log"><strong>${esc(l.action)}</strong><small style="display:block">${esc(l.operator)} · ${dateTime(l.at)}</small><span class="note">${esc(JSON.stringify(l.detail))}</span></div>`).join(''):'<div class="empty">暂无记录</div>')},

 help(){modal('本地原型说明',`<div class="notice">本地模拟 · 没有真实认证／后台／跨设备服务。原型不等于正式门店可用系统。</div><p class="note mt">演示账号 dealer01 / demo123，可操作1、2号桌；dealer02 / demo123，可操作2号桌。账号同浏览器不同窗口登录可演示旧窗口失效；同一账号只允许一场进行中比赛。</p><p class="note mt">本地门店营业时间示例18:00至次日03:00，属于开门当天营业日；具体营业时间由正式商家后台配置。玩家手机号为虚构演示数据，林小满／周一鸣的后4位相同，可核对前三位。陈星的次数为0，用于检查不足不能选位。</p><p class="note mt">外屏窗口仅为同浏览器只读状态和简化演出；真实摄像头、正式动画素材、云端语音、门店音响和跨设备接入尚未完成。启用语音时使用本机浏览器语音，不产生外部服务调用。</p><button class="wide mt" onclick="App.themes()">选择八套界面风格 · ${esc(theme.name)}</button><p class="note mt">本地预览会记住此浏览器的风格选择，不修改门店后台设置。</p><button class="wide mt" onclick="App.display()">打开只读外屏演示</button><hr class="hr"><button class="wide danger" onclick="App.resetAsk()">恢复本地演示初始数据</button>`)},

// 外屏只消费共享的本地演示状态；正式权威计时及权限校验需要共同后台实现。
let voice=false,audioId=null,utterance=null,displayBoot=true;
function completeRepeat(id){reload();const b=D.broadcasts.find(x=>x.id===id);if(!b||b.status!=='playing'){audioId=null;return}b.completed++;if(b.completed>=b.repeats){b.status='completed';b.ended=now()}else b.repeatAt=now();save();audioId=null;utterance=null}
function speakRecord(b){audioId=b.id;if(voice&&'speechSynthesis'in window){utterance=new SpeechSynthesisUtterance(b.text);utterance.lang='zh-CN';utterance.onend=()=>completeRepeat(b.id);utterance.onerror=e=>{reload();const x=D.broadcasts.find(z=>z.id===b.id);if(x?.status==='playing'){x.status='failed';x.error='本机语音未完整完成，请核对后手动补播';save()}audioId=null};speechSynthesis.speak(utterance)}else b.visualUntil=now()+Math.max(2200,b.text.length*130)}
function displayTick(){reload();tickClocks();const t=+QS.get('table')||1,pres=D.presentations[t],g=G(pres?.game);let changed=false;for(const b of D.broadcasts){if(b.table===t&&b.status==='waiting'&&now()>=b.readyAt){b.status='queued';changed=true}}let playing=D.broadcasts.find(b=>b.table===t&&b.status==='playing');if(displayBoot){displayBoot=false;if(playing){playing.status='failed';playing.error='本地外屏曾中断，请核对后手动补播';playing=null;changed=true}if(g?.resultPlayback?.status==='playing'){g.resultPlayback.status='failed';changed=true}}
if(audioId&&(!playing||playing.id!==audioId)){if('speechSynthesis'in window)speechSynthesis.cancel();audioId=null;utterance=null}
if(playing){if(pres?.game!==playing.game){playing.status='stopped';changed=true}else if(!audioId){playing.repeatAt=now();speakRecord(playing);changed=true}else if(!voice&&playing.visualUntil&&now()>=playing.visualUntil){completeRepeat(playing.id);reload();playing=D.broadcasts.find(b=>b.table===t&&b.status==='playing')}}
if(!playing&&g?.status==='active'){const next=D.broadcasts.filter(b=>b.table===t&&b.game===g.id&&b.status==='queued').sort((a,b)=>a.created-b.created)[0];if(next){next.status='playing';next.repeatAt=now();playing=next;speakRecord(next);changed=true}}
if(!playing&&pres?.mode==='result'&&g?.status==='finished'){const p=g.resultPlayback;if(p?.status==='ready'){p.status='playing';p.started=now();changed=true}if(p?.status==='playing'&&now()-p.started>7500){p.status='done';changed=true}}
D.displayHeartbeat={table:t,at:now()};if(changed)save();renderDisplay()}
function renderDisplay(){UI.table=+QS.get('table')||1;const pres=D.presentations[UI.table],g=G(pres?.game),playing=D.broadcasts.find(b=>b.table===UI.table&&b.status==='playing'&&pres?.game===b.game);let html='';if(playing)html=`<div class="fade-in"><span class="pill">${esc(playing.title)} · 第${playing.completed+1}/${playing.repeats}遍</span><div class="hero mt">${esc(playing.text)}</div><p class="muted mt">本地音画状态示意 · 不自动改变淘汰或名次</p></div>`;else if(pres?.mode==='result'&&g?.result){const rp=g.resultPlayback,champ=rp?.status==='playing'&&now()-rp.started<3000;html=champ?`<div class="fade-in"><div class="champion-art">${rankArt(0)}</div><p>本场冠军</p><div class="hero">${esc(P(g.result.pids[0]).name)}</div><p class="muted mt">结赛演出简化示意：先冠军，后前三</p></div>`:`<div class="fade-in"><span class="pill">${esc(g.label)} · 正式前三名</span><div class="rank-board">${[2,0,1].map(i=>`<div class="rank-col ${i===0?'first':''}"><div style="font-size:38px">${rankArt(i)}</div><strong>${esc(P(g.result.pids[i]).name)}</strong><p>${['冠军','亚军','季军'][i]}</p></div>`).join('')}</div><p class="muted">已结束 · 等待下一场准备</p></div>`}else if(g?.status==='active'){const st=g.stages[g.clock.index],c=g.clock;html=`<div><span class="pill">${c.paused?'已暂停':st.kind==='break'?'休息中':c.mode==='sustain'?'最后级别 · 持续进行':'第'+st.level+'级'}</span>${st.kind==='level'?`<div class="blinds">${st.sb} / ${st.bb}</div><p class="muted">小盲 / 大盲</p>`:'<h1 class="mt">休息时间</h1>'}<div class="bigclock mt">${c.mode==='sustain'?'持续进行':fmtTime(remaining(c))}</div><p class="muted mt">${c.paused?'等待荷官继续':c.mode==='sustain'?'等待现场决出前三名':'到时按已配置结构自动推进'}</p></div>`}else{const d=pres?.account?D.drafts[pres.account]:null;html=`<div><h1 class="mb">${UI.table}号桌 · 等待开局</h1>${mapHTML(d?.seats||{},false)}<p class="muted">与员工端使用同一座位映射 · 真实摄像头尚未接入</p></div>`}

window.enableVoice=()=>{if(D.broadcasts.some(b=>b.table===UI.table&&b.status==='playing'))return toast('请在本条演示播放结束后启用语音');if(!('speechSynthesis'in window))return toast('当前浏览器没有本机语音能力，继续使用画面示意');voice=true;const u=new SpeechSynthesisUtterance('本机演示语音已启用');u.lang='zh-CN';speechSynthesis.speak(u);renderDisplay()};
