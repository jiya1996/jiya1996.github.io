body{background:#f2f2f2}
a{color:var(--accent)}
button{border:1px solid #d2d2d2;color:#5f5f5f;padding:8px 15px;border-radius:2px}
button:hover:not(:disabled){border-color:var(--accent);background:#fff;color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.danger{color:var(--red)}
.small{padding:4px 10px;font-size:12px}
.link{border:0;background:none;padding:4px;color:var(--accent)}
.link:hover:not(:disabled){background:none;color:var(--accent-hover)}
input,select,textarea{border:1px solid #e6e6e6;border-radius:2px;padding:8px 10px;color:#333}
input:hover,select:hover,textarea:hover{border-color:#d2d2d2}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,77,214,.08)}
label.field>span{color:#333}
/* 侧栏：深色 + 选中蓝块 */
.side{width:220px;background:var(--sidebg);border-right:0;padding:0 0 18px;box-shadow:1px 0 2px rgba(0,0,0,.05)}
.brand{height:50px;padding:0 18px;gap:10px;background:var(--sidebg);box-shadow:0 1px 2px rgba(0,0,0,.15);flex-shrink:0}
.brand .coin{width:30px;height:30px}
.wordmark{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:2px}
.brand strong{font-size:20px;letter-spacing:2px;color:#fff}
.brand small{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:1px;margin-top:2px}
.navgroup{font-size:12px;letter-spacing:0;color:rgba(255,255,255,.35);padding:16px 20px 6px}
.nav{color:rgba(255,255,255,.72);border-radius:0;margin:0;padding:0 20px;height:44px;font-size:14px;gap:12px;border:0}
.nav:hover:not(:disabled){background:rgba(255,255,255,.05);color:#fff}
.nav.active{color:#fff;background:var(--accent);font-weight:400}
.nav.active:after{display:none}
.sidefoot{color:rgba(255,255,255,.35);padding:24px 20px 0}
.sidefoot .link{color:rgba(255,255,255,.65)}
.shell{margin-left:220px}
.top{height:50px;background:#fff;backdrop-filter:none;border-bottom:1px solid #f6f6f6;padding:0 20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.crumb{font-size:14px;color:#999}.crumb strong{color:#333;margin-left:6px}
.storeselect{background:#f2f2f2;border:1px solid #eee}
.identity{border-left-color:#eee}
.main{padding:15px 15px 40px;max-width:none}
.pagehead{background:#fff;padding:14px 18px;margin-bottom:15px;border-radius:2px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h1{font-size:18px;font-weight:600;letter-spacing:0;margin:0 0 4px}
h2{font-size:14px;font-weight:600;letter-spacing:0;color:#333}
.sub{color:#999}
.eyebrow{color:var(--accent);letter-spacing:1px}
.card{border:0;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:15px}
.cardhead{min-height:42px;padding:8px 15px;border-bottom:1px solid #f6f6f6}
.cardbody{padding:15px}
.grid{gap:15px}.stats{gap:15px;margin-bottom:15px}
.stat{border:0;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:16px 18px}
.stat label{color:#999}.stat strong{color:#333;font-size:28px;letter-spacing:0}
.toolbar{padding:12px 15px;border-bottom-color:#f6f6f6}
th{background:#FAFAFA;color:#666;font-weight:400;font-size:13px;padding:10px 15px;border-bottom:1px solid #eee}
td{padding:11px 15px;border-bottom:1px solid #eee;font-size:13px}
tbody tr:hover,.rowclick:hover{background:#f8f8f8}
.tag{border-radius:2px;background:#f2f2f2;color:#666}
.tag.green{background:#e8f7f0;color:#16a26a}.tag.amber{background:#fff7e6;color:#d48806}.tag.red{background:#fff1ec;color:#ff5722}.tag.blue{background:var(--tint);color:var(--accent)}
.dot{background:#16b777}
.note{background:#fafafa;border-left:5px solid var(--accent);color:#666;border-radius:0 2px 2px 0}
.note.amber{background:#fffbf0;border-color:#ffb800;color:#8a6d1f}
.note.red{background:#fff4f0;border-color:#ff5722;color:#c2410c}
.empty h3{color:#666}
.tab.active{color:var(--accent);border-color:var(--accent)}
.tableicon{background:var(--tint);color:var(--accent)}
.seatdots i{background:#e6e6e6}.seatdots i.on{background:var(--login)}
.levels i{background:#c9daf8}.levels i.rest{background:#ffe2a8}
.timeline li{border-left-color:#e6e6e6}.timeline li:before{background:var(--login)}
.stepper b{background:var(--tint);color:var(--accent)}
.previewbox{background:#fafafa;border:1px solid #eee;border-radius:2px}
.snapshot{border-color:#d2d2d2;background:#fafafa}
pre{background:#fafafa}
.badgecount{background:#f2f2f2}
.keyhint{border-color:#e6e6e6}
.modalback{background:rgba(0,0,0,.3);backdrop-filter:none}
.modal{border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.18)}
.modalhead{padding:0 20px;height:50px;border-bottom:1px solid #f0f0f0}
.modalbody{padding:20px}
.modal.large{width:980px}
.toast{background:rgba(0,0,0,.75);border-radius:2px;left:calc(50% + 110px)}
.mobilebar button.active{color:var(--accent)}
.colortone{color:var(--accent)}
.rulepage header{border-bottom-color:var(--accent)}
.avatar{background:#eaf1fd;color:#3b5c9e}
/* 品牌金币（与玩家端／荷官端／大屏同一枚） */
.coin{display:inline-block;width:30px;height:30px;border-radius:50%;background:var(--coin) center/cover no-repeat;flex-shrink:0}
/* 登录页：收银系统同款结构——浅色渐变全屏底 + 左上品牌 + 左侧标语 + 右侧白色圆角登录卡 */
.login{display:block;position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(55% 65% at 24% 45%,#c6f2d3 0,rgba(198,242,211,0) 70%),radial-gradient(45% 60% at 90% 10%,#a3d9f5 0,rgba(163,217,245,0) 70%),radial-gradient(50% 55% at 4% 100%,#6d7fe4 0,rgba(109,127,228,0) 72%),radial-gradient(40% 45% at 62% 100%,#9fd8ec 0,rgba(159,216,236,0) 70%),linear-gradient(135deg,#e6f7f1 0%,#d5effa 55%,#eaf5fd 100%)}
.loginlogo{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:9px;z-index:2}
.loginlogo .coin{width:40px;height:40px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.loginlogo b{font-size:28px;color:#1d2433;letter-spacing:2px}
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;padding:80px 20px 150px}
.loginart{background:none;padding:0;flex:0 1 600px;display:block;position:static;overflow:visible}
.loginart:after{content:none}
.loginart h1{font-size:44px;line-height:1.5;color:#fff;font-style:italic;font-weight:900;letter-spacing:5px;margin:0 0 18px;text-shadow:0 2px 14px rgba(40,80,170,.22)}
.loginart p{color:#fff;font-size:16px;line-height:1.9;max-width:none;letter-spacing:1px;text-shadow:0 1px 8px rgba(40,80,170,.2);margin:0}
.loginform{flex:0 0 400px;width:400px;max-width:100%;margin:0;background:#fff;border-radius:24px;padding:32px;box-shadow:0 10px 40px rgba(40,90,170,.08)}
.logintitle{font-size:30px;font-weight:400;color:#333;text-align:center;margin:0 0 18px;letter-spacing:1px}
.logintitle .wordmark{letter-spacing:1px}
.loginform label.field{gap:10px;margin:0 0 14px}
.loginform label.field>span{font-weight:700;color:#333;font-size:14px}
.loginform input:not([type=checkbox]){height:38px;border-radius:8px;background:rgba(0,0,0,.05);border:1px solid #e6e6e6;padding:0 10px}
.loginform input:not([type=checkbox]):focus{background:#fff;border-color:var(--login)}
.loginform input[type=checkbox]{accent-color:var(--login)}
.lrow{display:flex;justify-content:space-between;align-items:center;margin:2px 0 16px;font-size:13px;color:#666}.lrow .check{margin:0}
.lrow .link{color:var(--login)}
.loginbtn{width:100%;height:42px;padding:0 18px;background:var(--login);border:0;border-radius:8px;color:#fff;font-size:14px;letter-spacing:4px}
.loginbtn:hover:not(:disabled){background:#2f8af0;color:#fff}
.demolist{border-top:1px solid #f0f0f0;margin-top:18px;padding-top:14px;gap:8px}
.demolist .dtitle{font-size:12px;color:#999;margin:0}
.demolist button{border-radius:8px;border-color:#e6e6e6;background:#fff;color:#333}

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

function storesPage(){const st=store();return pagehead('门店设置','门店身份、外观与营业日，分别按明确的生效边界应用。')+`<div class="grid">${card('品牌资料',`<div class="cardbody">${form('brand',`<div class="formgrid">${field('门店ID','storeId',st.id,'text','disabled')}${field('门店名称','name',st.name,'text','required')}<label class="field wide"><span>门店Logo</span><input type="file" name="logo" id="logo-input" accept="image/*"><div id="logo-preview">${st.logo?`<img src="${esc(st.logo)}" alt="当前Logo">`:'<small class="muted">未配置Logo时使用店名。</small>'}</div>${button('移除Logo','remove-logo','','link small')}</label></div>${note('保存后基础页面读取新配置；已发布待播和在播内容保留发布时外观。')}<div class="actions">${button('预览各端效果','brand-preview')}</div>`,'保存门店资料')}</div>`)}${card('营业时间与营业日',`<div class="cardbody">${st.pendingHours?note(`待生效：${esc(st.pendingHours.open)}—${esc(st.pendingHours.close)}，${fmt(st.pendingHours.at)}起生效。`,'amber'):''}${form('hours',`<div class="formgrid">${field('营业开始／每日切换点','open',st.pendingHours?.open||st.open,'time','required')}${field('营业结束','close',st.pendingHours?.close||st.close,'time','required')}</div><label class="check"><input type="checkbox" name="nextDay" ${(st.pendingHours?.nextDay??st.nextDay)?'checked':''}>结束时间为次日</label>${note('修改从下一营业日的新开始时间生效；过渡时段延续当前营业日。历史记录和原场保持归属，营业结束不自动结束比赛。')}<p class="sub">当前营业日：${businessDay()} · 次数仍按获得时间起算，与营业日分开。</p>`,'预览生效时间')}</div>`)}</div>`+card('门店皮肤',`<div class="cardbody"><p class="sub" style="margin-bottom:15px">八套内置皮肤，与收银小程序八种店铺风格一一对应；统一为金属厚框游戏质感，按各风格主色着色。玩家端、荷官端与店内大屏同时读取。音画演出风格在“音画模板”独立设置。</p><div class="grid four">${skins.map(([n,c],i)=>`<button class="skin ${st.skin===i?'selected':''}" data-action="skin-preview" data-id="${i}">${skinThumb(i)}<span class="skinname">${skinNo(i)} ${n}</span><small>${st.skin===i?'当前已应用':'预览并应用'}</small></button>`).join('')}</div></div>`);}
function managersPage(){owner();return pagehead('管理账号','初始老板账号由产品方开通；老板维护店长与可管理门店。',button('＋ 新建店长','manager-new','','primary'))+card('账号与门店范围',table(['管理者','登录账号','角色','可管理门店','操作'],S.managers.map(a=>[person({...a,color:'#e4eee8'}),esc(a.login),tag(a.role==='owner'?'老板':'店长',a.role==='owner'?'green':''),a.stores.map(id=>esc(S.stores.find(s=>s.id===id)?.name)).join('<br>')||tag('无门店权限','amber'),a.role==='owner'?'交付账号':button('编辑门店权限','manager-edit',a.id,'small')])));}
function staffPage(){return pagehead('门店员工账号','后台统一设置账号与密码，员工直接使用；桌台不按员工分配。',button('＋ 开通员工','staff-new','','primary'))+card('员工列表',table(['当前使用人','登录账号','账号状态','当前准备／比赛','操作'],S.staff.filter(e=>e.storeId===storeId).map(e=>{const m=unfinished(e.id);return [person({...e,color:'#dce9df'}),esc(e.login),tag(e.active?'启用':'停用',e.active?'green':''),m?`${esc(tablename(m.tableId))} · ${m.status}`:'—',button('详情','staff-detail',e.id,'small')];})))+note('忘记密码时，由有权管理者查看当前密码交给本人；查看不会改变登录或比赛。换人和停用必须先处理原准备／比赛。');}
function tablesPage(){const ts=S.tables.filter(t=>t.storeId===storeId);return pagehead('桌台管理',`本店共 ${ts.length} 桌 · 启用 ${ts.filter(t=>t.active).length} 桌。有效员工看到同一套门店桌台。`,button('＋ 新增桌台','table-new','','primary'))+card('本店桌台',table(['桌台','配置状态','当前使用','当前荷官','显示器','操作'],ts.map(t=>{const m=match(t.matchId);return [esc(t.name),tag(t.active?'启用':'停用',t.active?'green':''),m?`${m.status} · ${m.id}`:'空闲',m?esc(m.staffName||staff(m.staffId)?.name):'—',S.bindings.filter(b=>b.tableId===t.id).map(b=>tag(b.purpose)).join(' ')||'未绑定',button('修改','table-edit',t.id,'small')+' '+button(t.active?'停用':'恢复','table-toggle',t.id,'small')];})));}
function playersPage(){const q=route.id||'',associated=S.players.filter(p=>p.stores.includes(storeId));let ps=q?S.players.filter(p=>p.stores.includes(storeId)?[p.id,p.name,p.phone].some(x=>x.includes(q)):p.id===q||p.phone===q):associated;return pagehead('玩家查询','查看本店关联玩家；已注册新客可用完整手机号或赛事用户ID精确查找。')+card('本店玩家与新客精确查找',`<form data-form="player-search" class="toolbar"><input name="query" aria-label="玩家查询" placeholder="完整手机号 / 用户ID / 本店昵称" value="${esc(q)}"><button class="primary" type="submit">查询</button>${button('重置','nav','players')}<span class="sub">查找不登记到店、不分座、不扣次</span></form>${table(['玩家','注册手机号','本店状态','可用次数','待抵扣','操作'],ps.map(p=>[person(p),esc(p.phone),!p.stores.includes(storeId)?tag('暂无本店记录'):tag(p.restricted.includes(storeId)?'本店受限':'正常',p.restricted.includes(storeId)?'red':'green'),balance(p.id).available,balance(p.id).pending,button('查看详情','player-detail',p.id,'small')]))}`);}
function creditsPage(){return pagehead('参赛次数','按门店独立记账，获得即用；最早到期优先，历史记录不覆盖。',button('增加次数','grant-select','','primary'))+card('本店次数账户',table(['玩家','当前可用','待抵扣','最近批次','操作'],S.players.filter(p=>p.stores.includes(storeId)||S.events.some(e=>e.playerId===p.id&&e.storeId===storeId)).map(p=>{const b=balance(p.id),g=S.events.filter(e=>e.storeId===storeId&&e.playerId===p.id&&e.type==='grant').at(-1);return [person(p),`<span class="amount">${b.available}</span>`,b.pending?tag(b.pending+'次','amber'):'0',g?fmt(g.at):'—',button('增加','grant',p.id,'small')+' '+button('明细／纠正','credit-detail',p.id,'small')];})))+note('有效期为获得成功时起算的连续24小时／天；合法原扣返还保留原到期时间。误发已使用部分先核对实际使用时点正常额度，再抵扣或形成待抵扣。');}
function importsPage(){const st=store();let body=`<div class="cardbody"><div class="stepper"><span><b>1</b>选择文件</span><span><b>2</b>核对列与身份</span><span><b>3</b>修改拟入账次数</span><span><b>4</b>确认入账</span></div>${note('CSV／.xlsx在本机解析。现有收银证据为空表头；导入真实脱敏样本后仍须核对用户ID对应、金额列、订单粒度与退款字段。')}<div class="formgrid"><label class="field"><span>消费文件</span><input type="file" id="import-file" accept=".csv,.xlsx"><small class="hint">支持UTF-8／GB18030 CSV及.xlsx；旧.xls请先另存为.xlsx。</small></label><div>${button('加载合成消费样例','import-sample','','ghost')}<p class="sub">样例用于演练，不是收银正式导出模板。</p></div></div>`;
 if(importBook){body+=`<div class="formgrid">${select('工作表','sheet',importBook.map((s,i)=>[i,s.name]),importFile?.sheet||0)}${select('表头行','header',importBook[importFile?.sheet||0].rows.slice(0,12).map((r,i)=>[i,`第${i+1}行 · ${r.slice(0,4).join(' / ')}`]),importFile?.header||0)}</div><p class="sub" style="margin-bottom:16px">已读取：${esc(importFile.name)}</p><div id="column-map">${mappingForm()}</div>`;}body+='</div>';
 return pagehead('消费记录导入','单笔消费金额超过店家设置的门槛计1次；核对或修改后才入账。',button('配置消费门槛','import-settings','','primary'))+`<div class="grid" style="grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)">${card('选择文件并核对字段',body)}${card('本店换算规则',`<div class="cardbody">${details([['单笔金额门槛',st.threshold===''?tag('尚未配置','amber'):`超过 ¥${esc(st.threshold)} 计1次`],['等于门槛','自动计算0次'],['同单高倍金额','自动最多1次，不按倍数累计'],['有效天数',st.creditDays+'天 · 入账成功时起算'],['确认前','可修改本次拟入账次数'],['已有待抵扣','先抵扣，展示净可用增加']])}${button('编辑规则 →','import-settings','','link')}</div>`)}</div>${importPreview?importPreviewHtml():''}`+card('导入批次',table(['批次／文件','来源','时间','处理记录','结果','操作'],S.imports.filter(i=>i.storeId===storeId).slice().reverse().map(i=>[`${esc(i.id)}<br><span class="sub">${esc(i.file)}</span>`,esc(i.source),fmt(i.at),`${i.count} 条 · 入账${i.qty}次`,tag(i.status,'green'),button('逐条结果','import-detail',i.id,'small')])));
}
const aliases={phone:['手机号','会员手机号','手机号码','phone'],external:['外部用户ID','客户UID','user_id','外部ID'],player:['赛事用户ID','用户ID','玩家ID','会员ID'],order:['订单编号','订单号','总单ID','order_id'],amount:['实收金额','实际支付','消费金额','金额','订单金额'],status:['订单状态','状态'],refund:['累计退款金额','退款金额'],store:['消费门店','门店'],time:['支付时间','消费时间','结算日期']};
function mappingForm(){const sheet=importBook[importFile.sheet||0],header=sheet.rows[importFile.header||0];return `<form data-form="import-parse"><div class="error" role="alert"></div><div class="formgrid">${field('来源系统（同一来源保持一致）','source',importFile.source||'本店收银','text','required')}${select('金额列粒度确认','grain',[['order','整单金额，同单多行是重复整单值'],['detail','尚为商品明细金额，需要先核对整单口径']],'order')}${Object.entries(aliases).map(([key,names])=>{const idx=header.findIndex(h=>names.includes(String(h).trim()));const titles={phone:'手机号列',external:'外部用户ID列（需已有对应）',player:'赛事用户ID列',order:'稳定订单标识列',amount:'用于计算的单笔金额列',status:'订单状态列',refund:'累计退款金额列',store:'消费门店列（可选）',time:'消费时间列（可选）'};return select(titles[key],key,[['','未配置'],...header.map((h,i)=>[String(i),String(h||'第'+(i+1)+'列')])],idx<0?'':String(idx));}).join('')}</div><label class="check"><input type="checkbox" name="storeVerified" required>已核对本文件属于当前门店；如有门店列，应与本店一致</label><label class="check"><input type="checkbox" name="effectiveVerified" required>已核对所选金额口径及有效消费／退款状态</label><button class="primary" type="submit">识别玩家并计算预览</button></form>`;}
function importPreviewHtml(){return card('核对并修改拟入账结果',`<div class="cardbody"><p class="sub">${esc(importPreview.file)} · 来源 ${esc(importPreview.source)} · ${importPreview.rows.length}笔订单。原始金额、自动次数与人工修改分别保留。</p></div><div class="tablewrap"><table><thead><tr>${['订单／来源行','玩家','原金额／累计退款','自动','本次入账／追回','状态'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${importPreview.rows.map((r,i)=>`<tr><td>${esc(r.order||'缺订单号')}<br><span class="sub">${r.rawRows.length}行${r.refundAction?' · 退款调整':''}</span></td><td>${r.playerId?person(player(r.playerId)):esc(r.identity||'未匹配')}</td><td>¥${r.amount.toFixed(2)} / ¥${r.refund.toFixed(2)}</td><td>${r.auto}</td><td><input class="inlineqty" aria-label="${esc(r.order)}拟入账次数" data-import-index="${i}" type="number" min="0" step="1" value="${r.qty}" ${r.ready?'':'disabled'}></td><td>${tag(r.message,r.ready?'green':r.duplicate?'':'amber')}${r.manual?' '+tag('原人工调整','amber'):''}</td></tr>`).join('')}</tbody></table></div><div class="cardbody">${note('可编辑的是本次增加／追回数量，不是覆盖账户总余额。身份、订单或金额未核清的记录不会入账。退款调整必须在本次预览确认后才处理。')}<div id="import-impact">${impactHtml()}</div><div class="formfoot">${button('取消本次预览','import-cancel')}${button('确认入账／调整','import-confirm','','primary')}</div></div>`);}
function impactHtml(){if(importPreview.rows.some(r=>r.ready&&(!C.integer(r.qty,true)||(r.refundAction&&r.qty>r.maxQty))))return note('请输入非负整数；退款追回量不能超过原笔尚未调整的已发数量。','red');const rows=importPreview.rows.filter(r=>r.ready);const ids=[...new Set(rows.map(r=>r.playerId))];return table(['玩家','本次增加','本次追回','预计净可用变化','预计待抵扣'],ids.map(id=>{const old=balance(id),ev=previewImportEvents(rows.filter(r=>r.playerId===id)),n=balance(id,storeId,[...S.events,...ev]);return [esc(player(id).name),rows.filter(r=>r.playerId===id&&!r.refundAction).reduce((n,r)=>n+r.qty,0),rows.filter(r=>r.playerId===id&&r.refundAction).reduce((n,r)=>n+r.qty,0),(n.available-old.available>=0?'+':'')+(n.available-old.available),n.pending];}));}
function previewImportEvents(rows){return rows.filter(r=>r.qty>0).map((r,i)=>r.refundAction?{id:r.eventId,type:'correction',grantId:r.receipt.grantId,qty:r.qty,at:now(),seq:i+1,playerId:r.playerId,storeId}:makeGrant(r.playerId,r.qty,store().creditDays,'消费',`消费导入 ${r.order}`,r.eventId,i+1));}
function templatesPage(){return pagehead('盲注与本场规则','本店共享模板，开局锁定本场结构；停用不删除历史。',button('＋ 新建模板','template-new','','primary'))+`<div class="grid three">${S.templates.filter(b=>b.storeId===storeId).map(b=>`<section class="card"><div class="template"><div class="tabletop"><h2>${esc(b.name)}</h2>${tag(b.active?'启用':'停用',b.active?'green':'')}</div><p class="sub">版本 ${b.version} · ${b.levels.length} 段结构 · ${b.levels.filter(l=>l.rest).length} 次休息</p><div class="levels">${b.levels.map((l,i)=>`<i class="${l.rest?'rest':''}" style="height:${l.rest?20:25+i*5}px"></i>`).join('')}</div><p class="sub">${b.rules?'已维护规则说明':'未配置规则说明 · 不影响开局'}</p><div class="actions" style="margin-top:20px">${button('编辑结构','template-edit',b.id,'small')}${button('规则正文','rules-edit',b.id,'small')}${button('复制','template-copy',b.id,'small')}${button(b.active?'停用':'恢复','template-toggle',b.id,'small')}</div></div></section>`).join('')}</div>`+note('来源模板更新／停用不覆盖已载入的赛前草稿，荷官开局前确认沿用或重选；已开场结构及说明版本保持不变。');}
function levelsHtml(ls){return table(['顺序','类型','小盲／大盲','时长'],ls.map((l,i)=>[i+1,l.rest?tag('休息','amber'):tag('盲注'),l.rest?'—':`${l.sb} / ${l.bb}`,l.minutes+'分钟']));}
function screensPage(){return pagehead('桌台与显示屏','后台生成配对码，目标屏输入；现场识别后由后台确认绑定。',button('打开屏幕端演练','open-screen'))+note('本页只演练同浏览器配对与识别流程。电视浏览器／外接播放设备的真实接入条件仍待现场验证；本地连接不代表真实电视已接通。','amber')+card('桌台与用途',table(['桌台','用途','本地绑定','本地读取状态','操作'],S.tables.filter(t=>t.storeId===storeId&&t.active).flatMap(t=>['直播屏','计时屏'].map(p=>{const b=S.bindings.find(b=>b.tableId===t.id&&b.purpose===p);return [esc(t.name),p,b?tag('已确认本地绑定','green'):'未绑定',b?'本地演练，不代表现场在线':'—',b?button('绑定详情','binding-detail',b.id,'small'):button('绑定显示屏','pair-new',t.id+'|'+p,'small')];}))))+card('正在接入',table(['配对码','目标','状态','操作'],S.pairings.filter(p=>p.storeId===storeId&&!p.done&&!p.cancelled).map(p=>[esc(p.code),esc(tablename(p.tableId))+' · '+p.purpose,tag(p.connected?(p.identified?'已识别，待确认':'已接入，待识别'):'等待屏幕输入',p.connected?'green':'amber'),p.connected?button('识别屏幕','pair-identify',p.id,'small')+' '+button('确认绑定','pair-confirm',p.id,'small',''+(!p.identified?'disabled':''))+' '+button('取消','pair-cancel',p.id,'small'):button('查看接入步骤','pair-detail',p.id,'small')+' '+button('取消','pair-cancel',p.id,'small')])));}

function target(list,id){const x=list.find(x=>x.id===id);C.requireValue(x,'记录不存在');if(x.storeId)C.requireValue(x.storeId===storeId,'目标不属于当前门店');return x;}
function makeGrant(pid,qty,days,source,note,gid=UID('G'),seq=0){return {id:gid,type:'grant',playerId:pid,storeId,qty,days,source,note,at:now(),expiry:iso(+new Date(now())+days*C.DAY),seq};}
function addGrant(next,event){next.events.push(event);const p=next.players.find(p=>p.id===event.playerId);if(!p.stores.includes(event.storeId))p.stores.push(event.storeId);}

async function action(a,id,el){

 if(a==='simulate'){simulate=id;close(true);toast(id==='fail'?'下次保存会明确失败且不写入':'下次保存会写入但模拟回执未知');return;}

 if(a==='reset-demo'){if(!confirm('仅重置本原型的合成数据。其他玩家／荷官演示不受影响，是否继续？'))return;S=C.seed();localStorage.setItem(K,JSON.stringify(S));session=null;localStorage.removeItem(SK);sessionStorage.removeItem(SK);sessionStorage.removeItem(SS);sessionStorage.removeItem(CS);close(true);render();return;}
 if(a==='mobile-menu'){modal('全部管理功能',menu.map(([g,items])=>`<h3>${g}</h3><div class="actions" style="margin-bottom:20px">${items.filter(x=>x[0]!=='managers'||manager()?.role==='owner').map(([p,i,t])=>button(t,'menu-nav',p)).join('')}</div>`).join(''));return;}
 if(a==='menu-nav'){close(true);return navigate(id);}
 if(a==='open-dealer'||a==='open-screen'||a==='public-rule'){window.open(location.href.split('#')[0]+'#/'+(a==='open-dealer'?'dealer':a==='open-screen'?'screen':'rules/'+encodeURIComponent(id)),'_blank','noopener');return;}

 if(a==='staff-detail')return showStaff(target(S.staff,id));

 if(a==='staff-toggle'){const e=target(S.staff,id);C.requireValue(!unfinished(e.id),'该账号有未结束准备／比赛，请先按现场流程处理，不能停用或换人');modal(e.active?'停用员工账号':'恢复员工账号',form('staff-toggle',note(`${esc(e.login)} · 当前使用人 ${esc(e.name)}。${e.active?'成功停用后旧登录失效，资料和历史保留。':'恢复后员工用后台设置的当前密码登录，不恢复被撤销的旧登录。'}`)+area('操作原因','reason'),'确认'+(e.active?'停用':'恢复'),id));return;}

function skinThumb(i){const s=SKIN_DATA[i];return `<div class="skinthumb" style="${skinVars(i)}"><div class="tv mini"><div class="rays"></div><div class="mframe tvplate"><span class="coin"></span><span class="pl"><b class="mt">四条</b><i>FOUR OF A KIND</i></span></div></div><div class="swatches"><i style="background:${s.t.bg}" title="玩家端底色"></i><i style="background:${s.t.card}" title="卡片"></i><i style="background:${s.t.accent}" title="主色"></i><i style="background:${s.t.metal}" title="金属描边"></i></div></div>`;}
function phoneMock(i){const s=SKIN_DATA[i];return `<div class="phonemock" style="${skinVars(i)}"><div class="pm-top"><span class="coin"></span><b>joker</b><small>玩家端</small></div><div class="pm-card"><small>本店赛事</small><strong>今晚 20:00 · 常规赛</strong><div class="pm-row"><span>参赛次数</span><b>3</b></div><span class="pm-btn">立即报名</span></div><div class="pm-card thin"><small>荣誉</small><strong>LV3 · 夜行猎手</strong></div></div>`;}
function idleTV(i){return `<div class="tv" style="${skinVars(i)}"><div class="rays"></div><div class="idle"><span class="coin big"></span><b class="wordmark">joker</b><small>TOURNAMENT CLUB</small><em>本桌赛事进行中 · 精彩时刻即将呈现</em></div></div>`;}
const CUE_KINDS={'牌型':{subs:[['rf','皇家同花顺'],['sf','同花顺'],['quads','四条'],['fh','葫芦'],['s27','27收池（趣味）']],def:'quads',beats:'五张牌飞入 → 逐张翻开 → 碰撞 → 牌型名砸入。档位：皇家同花顺＞同花顺＞四条＞葫芦；27收池为趣味特别播报（7＋2杂色赢下底池）。'},
 '击杀':{subs:[['A','只选A：A 完成击杀'],['AB','选A和B：A 击杀 B']],def:'AB',beats:'A 的头像入场 → 蓄力重拳 → 闪白／顿帧／震屏／裂纹 → 大字砸入。选了B时显示「A 击杀 B」，B 头像碎裂并盖「被击杀」印章。'},
 '结赛':{subs:[['champ','冠军时刻'],['top3','前三揭晓']],def:'champ',beats:'五剑炸桌 → 巨剑插地 → 冠军头像与昵称 → 前三依次揭晓（季军→亚军→冠军），停留页为 亚军｜冠军｜季军 金属厚框卡。'}};
const CUE_TPL={'赛场动感':{k:'dyn',hint:'满强度：蓄力→重击→闪白→顿帧→强震屏→冲击波／裂纹／碎片→大字砸入。'},'荣耀庆典':{k:'glory',hint:'金色仪式感：同样的节拍，震屏约六成，加聚光灯、旋转光环与金色余烬。'},'简约专业':{k:'pro',hint:'克制版：同样的节拍，顿帧更短、震屏约三成、粒子减半，网格线框构图。'}};
const CUE_HANDS={rf:{n:'皇家同花顺',en:'ROYAL FLUSH',r:5,c:[['A','♠'],['K','♠'],['Q','♠'],['J','♠'],['10','♠']]},sf:{n:'同花顺',en:'STRAIGHT FLUSH',r:4,c:[['9','♥'],['8','♥'],['7','♥'],['6','♥'],['5','♥']]},quads:{n:'四条',en:'FOUR OF A KIND',r:3,c:[['Q','♠'],['Q','♥'],['Q','♦'],['Q','♣'],['7','♦']]},fh:{n:'葫芦',en:'FULL HOUSE',r:2,c:[['K','♠'],['K','♥'],['K','♦'],['9','♣'],['9','♥']]},s27:{n:'27收池',en:'7-2 TAKES THE POT',r:0,c:[['7','♦'],['2','♣']]}};
const CUE_P={A:{n:'夜行猎手',g:'夜',seat:5},B:{n:'小满',g:'满',seat:6},P2:{n:'红桃老K',g:'K',seat:2},P3:{n:'阿May',g:'M',seat:3}};
function cueAv(p,cls=''){return `<span class="cav ${cls}"><span>${esc(p.g)}</span></span>`;}
function cueCard([r,s],i){const red=s==='♥'||s==='♦';return `<span class="pcard" style="--i:${i}"><span class="pface ${red?'red':''}"><b>${r}</b><i>${s}</i></span><span class="pback"></span></span>`;}
function cueStage(kind,sub,tplName,skinIdx,play=false){const tp=(CUE_TPL[tplName]||CUE_TPL['赛场动感']).k;let inner='';
 if(kind==='牌型'){const h=CUE_HANDS[sub]||CUE_HANDS.quads;inner=`<p class="cue-tag">HAND · 牌型播报</p><div class="cards n${h.c.length}">${h.c.map(cueCard).join('')}</div><b class="mt slam handname ${h.n.length>3?'long':''}">${h.n}</b><i class="en">${h.en}</i>${h.r?`<span class="stars">${'★'.repeat(h.r)}</span>`:'<span class="stars fun">趣味播报</span>'}<div class="plate">${cueAv(CUE_P.A)}<span><b>${esc(CUE_P.A.n)}</b><small>${CUE_P.A.seat}号位</small></span></div>`;}
 else if(kind==='击杀'){const ab=sub==='AB';inner=`<p class="cue-tag">KILL · 击杀播报</p><div class="kill ${ab?'ab':''}"><div class="ka">${cueAv(CUE_P.A,'big')}<b>${esc(CUE_P.A.n)}</b></div><span class="fist"></span>${ab?`<div class="kb">${cueAv(CUE_P.B,'big shatter')}<b>${esc(CUE_P.B.n)}</b><span class="stamp">被击杀</span></div>`:''}</div><b class="mt slam killtxt">${ab?`${esc(CUE_P.A.n)} 击杀 ${esc(CUE_P.B.n)}`:'完成击杀'}</b><span class="crackfx"></span>`;}
 else{if(sub==='top3'){const slot=(p,place,cls)=>`<div class="podium ${cls}"><div class="mframe">${cueAv(p,'big')}</div><b>${esc(p.n)}</b><small>${place}</small></div>`;inner=`<p class="cue-tag">FINAL · 本场前三</p><div class="top3">${slot(CUE_P.P2,'亚军','p2')}<div class="podium p1"><span class="crown">♛</span><div class="mframe">${cueAv(CUE_P.A,'big')}</div><b>${esc(CUE_P.A.n)}</b><small>冠军</small></div>${slot(CUE_P.P3,'季军','p3')}</div>`;}
  else inner=`<p class="cue-tag">FINAL · 冠军时刻</p><div class="swords">${[0,1,2,3,4].map(i=>`<i style="--i:${i}"></i>`).join('')}</div><span class="bigsword"></span><div class="champ">${cueAv(CUE_P.A,'big')}<b class="mt slam">本场冠军</b><strong>${esc(CUE_P.A.n)}</strong></div>`;}
 return `<div class="tv cue tpl-${tp} k-${kind==='牌型'?'hand':kind==='击杀'?'kill':'final'} ${play?'play':''}" style="${skinVars(skinIdx)}"><div class="rays"></div>${tp==='pro'?'<div class="grid-lines"></div>':''}<div class="flash"></div><div class="cue-body">${inner}</div></div>`;}
function cueForm(kind){return document.querySelector(`form[data-form="audio"] input[name="kind"][value="${kind}"]`)?.closest('form');}
function cueTplOf(kind){return cueForm(kind)?.querySelector('[name=style]')?.value||S.audio[storeId]?.[kind]||'赛场动感';}
function cueModal(){const m=modalState.cue;return `<div class="cuebar"><div class="seg">${CUE_KINDS[m.kind].subs.map(([k,t])=>button(t,'cue-sub',k,m.sub===k?'on':'')).join('')}</div><div class="seg">${Object.keys(CUE_TPL).map(t=>button(t,'cue-tpl',t,m.tpl===t?'on':'')).join('')}</div></div><div id="cue-stage">${cueStage(m.kind,m.sub,m.tpl,store().skin,true)}</div><p class="sub" style="margin:12px 0 4px"><b>${esc(m.tpl)}</b>：${CUE_TPL[m.tpl].hint}</p><p class="sub">${CUE_KINDS[m.kind].beats}</p>${note('预览使用本店当前皮肤（'+esc(skins[store().skin][0])+'）与示例昵称，不进入任何播放队列；正式画面以店内大屏 animation.html 为准，语音播报与现场扬声器另需实测。')}<div class="formfoot">${button('重播画面','cue-replay')}${button('播放音效','cue-sound','','primary')}</div>`;}
// ---- 原创程序音效（WebAudio），配方同大屏 SFX；只在本机试听 ----
let CUE_AU=null;
function stopCue(){if(CUE_AU){try{CUE_AU.ctx.close()}catch{}CUE_AU=null;}}
function playCue(kind,sub,tplName){const AC=window.AudioContext||window.webkitAudioContext;C.requireValue(AC,'当前浏览器不支持本地提示音试听');stopCue();const ctx=new AC(),m=ctx.createGain(),tp=(CUE_TPL[tplName]||CUE_TPL['赛场动感']).k,k={dyn:1,glory:.85,pro:.6}[tp];m.gain.value=.7*k;m.connect(ctx.destination);
 const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;CUE_AU={ctx};const T0=ctx.currentTime+.05;
 const G=(t,a,dd,pk)=>{const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dd);g.connect(m);return g;};
 const O=(type,f0,f1,t,dur,dest)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);o.connect(dest);o.start(t);o.stop(t+dur+.05);return o;};
 const N=(t,dur,dest,ft,f0,f1,q)=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;const f=ctx.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q||1;s.connect(f);f.connect(dest);s.start(t);s.stop(t+dur+.05);};
 const X={whoosh:t=>N(t,.5,G(t,.08,.42,.5),'bandpass',300,3200,1.2),impact:t=>{O('sine',140,38,t,.55,G(t,.005,.6,1));N(t,.3,G(t,.002,.3,.6),'lowpass',1800,200);},kick:t=>O('sine',160,48,t,.22,G(t,.002,.25,.9)),snare:t=>{N(t,.16,G(t,.002,.16,.45),'highpass',1500);O('triangle',190,120,t,.1,G(t,.002,.1,.3));},
  tick:(t,f=1800)=>O('square',f,null,t,.03,G(t,.001,.04,.12)),chime:(t,b=880,pk=.25)=>[1,2.76,5.4].forEach((h,i)=>O('sine',b*h,null,t,1.6,G(t,.005,1.5/(i+1),pk/(i+1)))),shimmer:t=>[0,.07,.14,.21,.28,.35].forEach((dd,i)=>X.chime(t+dd,1320*Math.pow(1.12,i),.09)),
  swell:(t,dd=1.4)=>N(t,dd,G(t,dd*.8,.6,.22),'bandpass',600,2400,.7),win:t=>[523,659,784,1047].forEach((f,i)=>O('triangle',f,null,t+i*.09,.5,G(t+i*.09,.005,.45,.2))),clean:t=>[880,1320].forEach((f,i)=>O('sine',f,null,t+i*.12,.9,G(t+i*.12,.005,.8,.2))),ping:(t,f=1500)=>O('sine',f,null,t,.5,G(t,.002,.45,.18)),
  fanfare:t=>[[523,659,784],[587,740,880],[659,830,988],[784,988,1175]].forEach((c,i)=>{const s=t+[0,.18,.36,.6][i],len=i==3?1.4:.2;c.forEach(f=>O('sawtooth',f,null,s,len,G(s,.01,len,.06)));}),
  boing:t=>{const o=O('sine',260,null,t,.55,G(t,.005,.55,.35));o.frequency.exponentialRampToValueAtTime(90,t+.18);o.frequency.exponentialRampToValueAtTime(330,t+.45);},coins:t=>{for(let i=0;i<9;i++){const tt=t+i*.055;O('square',2400+i*190,null,tt,.05,G(tt,.001,.08,.06));}},
  sub:(t,pk=1)=>{O('sine',92,26,t,1.3,G(t,.004,1.3,pk));O('triangle',62,30,t,.5,G(t,.004,.5,pk*.5));},clank:(t,pk=.22)=>{[1240,1873,2690,3910,5230].forEach((f,i)=>O(i%2?'square':'sine',f,f*.985,t,.6,G(t,.001,.5/(1+i*.4),pk/(1+i*.6))));N(t,.08,G(t,.001,.08,.4),'highpass',4000);},
  crack:t=>{N(t,.25,G(t,.001,.25,.7),'highpass',2500);N(t,.4,G(t,.002,.4,.5),'bandpass',900,300,2);},smash:(t,kk=1)=>{X.sub(t,.9*kk);X.impact(t);X.clank(t,.2*kk);X.crack(t);},swish:t=>N(t,.22,G(t,.01,.2,.55),'bandpass',5200,700,3),
  charge:(t,dd=.8)=>{const g=G(t,dd*.9,.1,.25),f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(5000,t+dd);f.connect(g);O('sawtooth',180,1100,t,dd,f);O('sine',220,880,t,dd,G(t,dd,.05,.14));},
  glass:t=>{for(let i=0;i<10;i++){const tt=t+i*.024;O('sine',3000+i*380,null,tt,.12,G(tt,.001,.12,.05));}N(t,.35,G(t,.001,.35,.35),'highpass',3500);},flip:t=>{N(t,.06,G(t,.001,.06,.35),'bandpass',2500,1200,2);O('triangle',900,600,t,.05,G(t,.001,.05,.1));},rumble:(t,dd=1)=>N(t,dd,G(t,dd*.6,dd*.4,.5),'lowpass',160,80,1)};
 const at=(s,n,...a)=>X[n](T0+s,...a);let end=3;
 if(kind==='牌型'){const n=(CUE_HANDS[sub]||CUE_HANDS.quads).c.length;at(0,tp==='pro'?'tick':tp==='glory'?'swell':'whoosh');for(let i=0;i<n;i++)at(.35+i*.12,'flip');
  if(sub==='s27'){at(1.2,'boing');at(1.5,'coins');}else if(tp==='dyn'){at(1.2,'smash');at(1.5,'win');}else if(tp==='glory'){at(1.2,'impact');at(1.2,'clank',.14);at(1.4,(sub==='rf'||sub==='sf')?'fanfare':'chime',660);at(1.6,'shimmer');}else{at(1.2,'ping',1200);at(1.4,'clean');}end=3.4;}
 else if(kind==='击杀'){if(tp==='dyn'){at(0,'charge');at(.8,'smash');}else if(tp==='glory'){at(0,'swell',.8);at(.15,'charge',.65);at(.8,'impact');at(.9,'chime',660);}else{at(0,'tick');at(.8,'kick');at(.9,'ping',1300);}if(sub==='AB'){at(1.15,'glass');at(1.3,tp==='pro'?'tick':'snare');}at(1.4,tp==='pro'?'clean':'win');end=3;}
 else{if(sub==='top3'){[0,.9,1.8].forEach((s,i)=>{at(s,tp==='pro'?'tick':'whoosh');at(s+.15,i<2?(tp==='pro'?'ping':'impact'):'smash',...(i<2?[]:[tp==='dyn'?1:.6]));});at(2.2,tp==='pro'?'clean':'fanfare');if(tp==='glory')at(2.4,'shimmer');end=4.4;}
  else{at(0,tp==='pro'?'tick':'rumble');for(let i=0;i<5;i++)at(.2+i*.12,'swish');at(1,tp==='pro'?'kick':'smash',tp==='dyn'?1:.6);at(1.6,'sub',tp==='dyn'?1:.6);at(2,tp==='pro'?'win':'fanfare');if(tp==='glory')at(2.2,'shimmer');end=4.2;}}
 const me=CUE_AU;setTimeout(()=>{if(CUE_AU===me)stopCue();},end*1000+600);}
function replayCue(){const m=modalState.cue,box=$('#cue-stage');if(!m||!box)return;box.innerHTML=cueStage(m.kind,m.sub,m.tpl,store().skin,false);void box.offsetWidth;box.innerHTML=cueStage(m.kind,m.sub,m.tpl,store().skin,true);}
function cueAction(a,id){
 if(a==='audio-preview'){C.requireValue(CUE_KINDS[id],'播报类型无效');modal('音画预览 · '+id+'播报',`<div id="cue-modal"></div>`,true);modalState.cue={kind:id,sub:CUE_KINDS[id].def,tpl:cueTplOf(id)};$('#cue-modal').innerHTML=cueModal();return true;}
 if(a==='audio-beep'){C.requireValue(CUE_KINDS[id],'播报类型无效');playCue(id,CUE_KINDS[id].def,cueTplOf(id));toast(`本机试听：${id} · ${cueTplOf(id)}（原创程序音效；不代表现场扬声器回执）`);return true;}
 const m=modalState.cue;if(!m)return false;
 if(a==='cue-sub'){m.sub=id;$('#cue-modal').innerHTML=cueModal();return true;}
 if(a==='cue-tpl'){C.requireValue(CUE_TPL[id],'演出模板无效');m.tpl=id;$('#cue-modal').innerHTML=cueModal();return true;}
 if(a==='cue-replay'){replayCue();return true;}
 if(a==='cue-sound'){replayCue();playCue(m.kind,m.sub,m.tpl);toast('本机试听原创程序音效；语音播报及现场扬声器需另行实测');return true;}
 return false;}
document.addEventListener('change',ev=>{const f=ev.target.closest&&ev.target.closest('form[data-form="audio"]');if(!f||ev.target.name!=='style')return;const kind=f.querySelector('[name=kind]').value,t=ev.target.value;if(!CUE_KINDS[kind]||!CUE_TPL[t])return;f.querySelector('.tplhint').textContent=CUE_TPL[t].hint;f.querySelector('.cuethumb').innerHTML=cueStage(kind,CUE_KINDS[kind].def,t,store().skin);});
// 只向本地验证暴露状态读取与纯核算，不提供绕过UI的业务写入API。
window.MerchantDemo={snapshot:()=>C.clone(S),balance:(pid,sid)=>balance(pid,sid),storageKey:K};
render();
})();
</script></body></html>
